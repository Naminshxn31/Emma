<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 400 1980 800" width="1584" height="640">
  <!--
    Basement parking, drawn for the robot face (owner, 13 Oct: "ที่อยากให้
    เขียนขึ้นคือที่จอดรถ" -- the earlier picture was a thin-line crop of one
    corner). Traced from the website pack's BASEMENT FLOOR PLAN (web/3.project
    details/master plan/_Embassy World  Floor Plan/2.png): the SVG's units ARE
    that sheet's pixels, so a point can be checked against it directly.
    What it shows, and where each comes from:
      - the one-level ring and the courtyard it wraps: the sheet's walls,
        simplified (cores and stairs left out);
      - building letters: the sheet's own KEY PLAN, mapped onto the ring
        (E west, F north-west, A north, B east, C south-east, D south-west);
      - EV CHARGING on the south-west lane: the sheet prints "WITH EV CHARGER"
        there, and report 7.6 puts EV charging under building D;
      - stall rows: where the sheet draws stalls, as texture -- NOT a count
        (the number on screen is the story's own: report 7.1, approximate).
    Left out on purpose: every facility name in the block under building A
    (the sheet's names include ones the owner removed, deny_terms, and place
    rooms in the basement that the approved facts do not), ramps/entrances
    (the sheet does not say which way they run), motorbike bays (not marked),
    any number of chargers (not given).
    Written by a one-off generator; edit this file directly from now on.
    Rendered by scripts/draw_story_plans.py.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1438"/>
      <stop offset="1" stop-color="#090d29"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="30" y="400">
      <path d="M40 0H0V40" fill="none" stroke="#28316c" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#6c7fd6" stroke-width="2" opacity="0.35"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2768"/>
      <stop offset="1" stop-color="#18205a"/>
    </linearGradient>
    <clipPath id="ring"><path d="M118 488L352 488L352 470L955 470L955 465L1670 467L1900 470L1900 500L1912 500L1950 590L1875 980L1460 1135L910 1135L910 1095L318 1095L318 1055L242 1055L242 1070L90 1070L90 848L103 848L103 625L118 625Z"/></clipPath>
    <filter id="glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="30" y="400" width="1980" height="800" fill="url(#bg)"/>
  <rect x="30" y="400" width="1980" height="800" fill="url(#grid)"/>

