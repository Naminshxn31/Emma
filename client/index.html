//: Put a framed page on the stage — a video, a map, anything that agrees
//: to be embedded. The server decides what qualifies (`embeddable()` in
//: app/tools/computer.py); anything that does not never reaches here, so
//: this end never has to render a blank white rectangle and guess why.
let frameWatch = null;
function showFrame(url) {
  const stage = $('stage');
  const f = $('stageFrame');
  // A frame that is refused renders as a grey rectangle with a broken-page
  // icon and puts nothing actionable in the console — the owner's exact
  // experience, twice. There is no event for "the site said no", so the
  // page waits for a load that should have happened and says so when it
  // does not, with the one thing it can still offer.
  let loaded = false;
  f.onload = () => { loaded = true; };
  if (frameWatch) clearTimeout(frameWatch);
  frameWatch = setTimeout(() => {
    if (loaded || !stage.classList.contains('framed')) return;
    systemLine('เว็บนี้ไม่ยอมให้แสดงในหน้านี้ · the site refused to be embedded');
    clearFrame();
  }, 6000);
  f.src = url;
  stage.classList.add('on', 'framed');
  $('callScreen').classList.add('with-slides', 'stage-only');
  $('stageTitle').textContent = '';
  $('stagePos').textContent = '';
}

function clearFrame() {
  if (frameWatch) { clearTimeout(frameWatch); frameWatch = null; }
  $('stageFrame').onload = null;
  $('stage').classList.remove('unit');
  $('unitCard').textContent = '';
  $('unitCard').className = '';
  // src='' rather than hiding it: an iframe left loaded keeps playing, and
  // a video still talking behind a hidden panel is the audio-lead bug with
  // no way to see what is doing it.
  $('stageFrame').removeAttribute('src');
  $('stage').classList.remove('framed');
  showStage(null);
}

function showStage(slide, displays) {
  const stage = $('stage');
  if (!slide) {
    stage.classList.remove('on');
    $('callScreen').classList.remove('with-slides', 'stage-only');
    stage.classList.remove('unit');
    $('unitCard').textContent = '';
    $('unitCard').className = '';
    $('stageImg').removeAttribute('src');
    // Clear the caption too. It was only ever hidden along with the stage,
    // so anything that leaves the stage visible leaves the previous slide's
    // name under it — a label for a picture that is no longer there.
    $('stageTitle').textContent = '';
    $('stagePos').textContent = '';
    return;
  }
  // A slide arriving over a video wins, and the video has to actually stop
  // rather than keep playing out of sight.
  if (stage.classList.contains('framed')) {
    $('stageFrame').removeAttribute('src');
    stage.classList.remove('framed');
  }
  $('callScreen').classList.add('with-slides');
  $('stageImg').src = slide.url;
  $('stageTitle').textContent = slide.title_th || slide.title_en || '';
  $('stagePos').textContent =
    slide.position && slide.total ? `${slide.position} / ${slide.total}` : '';
  stage.classList.add('on');

  // Say it once per call rather than on every slide.
  if (!displays && !warnedNoDisplay) {
    warnedNoDisplay = true;
    systemLine('ยังไม่ได้เปิดจอเต็ม — กด "เปิดจอเต็ม" มุมขวาบนของภาพ · no fullscreen display connected');
  }
}

// The bubble of a reply that was just cut off. The transcript keeps arriving
// for a second or two after the audio stops — the model had already generated
// the rest — so that late text belongs to *this* bubble, marked unheard,
// rather than opening a new one that never had any audio behind it.
let cutBot = null;

// Split an interrupted bubble at the point the audio actually stopped and
// dim everything past it. `ratio` is heard ms / generated ms, which is the
// best estimate available: speech rate is near enough constant within a turn
// that character position tracks time closely.
function markUnheard(turn, ratio) {
  const bubble = turn.querySelector('.bubble');
  const full = bubble.textContent;
  if (!full) return null;

  let cut = Math.round(full.length * Math.max(0, Math.min(1, ratio)));
  // Don't slice a Latin word in half if a space is close by. Thai has no
  // word spaces, so there is nothing to snap to and the raw cut stands.
  for (let i = 0; i <= 6; i++) {
    if (full[cut - i] === ' ') { cut = cut - i + 1; break; }
    if (full[cut + i] === ' ') { cut = cut + i + 1; break; }
  }

  bubble.textContent = full.slice(0, cut);
  const rest = document.createElement('span');
  rest.className = 'unheard';
  rest.textContent = full.slice(cut);
  bubble.appendChild(rest);
  return rest;
}

function appendText(role, text) {
  if (!text) return;
  // Tail of a reply the guest already talked over.
  if (role === 'bot' && !liveTurn.bot && cutBot) {
    cutBot.textContent += text;
    scrollConvo();
    return;
  }
  let turn = liveTurn[role];
  if (!turn) {
    turn = document.createElement('div');
    turn.className = 'turn live ' + role;
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = LABEL[role];
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    turn.append(who, bubble);
    // Both APIs send input and output transcriptions independently, with no
    // guaranteed ordering — the guest's transcript often lands *while* the
    // reply is already streaming. Putting it above the in-progress reply
    // keeps the visual order (asked, then answered) truthful.
    if (role === 'user' && liveTurn.bot) {
      $('convo').insertBefore(turn, liveTurn.bot);
    } else {
      $('convo').appendChild(turn);
    }
    liveTurn[role] = turn;
  }
  const bubble = turn.querySelector('.bubble');
  bubble.textContent += text;
  // The kiosk line shows only Emma, and only the turn in progress. The
  // guest's own transcript stays off it for the same two reasons the robot
  // screen keeps it off: a mishearing shown in public makes a working robot
  // look broken, and the prompt has her read phone numbers back to confirm.
  if (role === 'bot') kioskSay(bubble.textContent);
  scrollConvo();
}

function finalizeTurn(role, { interrupted = false, spokenRatio = 1 } = {}) {
  const turn = liveTurn[role];
  liveTurn[role] = null;
  if (!turn) return;
  turn.classList.remove('live');
  const bubble = turn.querySelector('.bubble');
  if (!bubble.textContent.trim()) { turn.remove(); return; }
  if (interrupted) {
    const tag = document.createElement('div');
    tag.className = 'cut';
    if (role === 'bot' && spokenRatio < 0.98) {
      cutBot = markUnheard(turn, spokenRatio);
      tag.textContent = 'ถูกพูดแทรก · ข้อความจางคือส่วนที่ยังไม่ได้พูด';
    } else {
      tag.textContent = 'ถูกพูดแทรก · interrupted';
    }
    turn.appendChild(tag);
  }
  scrollConvo();
}

function finalizeAll(opts) { finalizeTurn('user'); finalizeTurn('bot', opts); }

function scrollConvo() {
  const el = $('convo');
  // Don't yank the view if the user scrolled up to re-read something.
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  if (nearBottom) el.scrollTop = el.scrollHeight;
}

function systemLine(text, reopen) {
  finalizeAll();
  const d = document.createElement('div');
  d.className = 'cut';
  d.style.alignSelf = 'center';
  d.textContent = text;
  if (reopen) {
    // A line that says something was opened, with the thing itself one tap
    // away. Closing the stage used to be one-way — the video was gone and
    // the only route back was asking again, which spends a whole turn and
    // an API call to reach something the page already knows the address of.
    d.textContent = text + '  ·  แตะเพื่อเปิดบนจอ';
    d.style.cursor = 'pointer';
    d.style.textDecoration = 'underline';
    d.onclick = () => (reopen.embed ? showFrame(reopen.embed) : showUnit(reopen.unit));
  }
  $('convo').appendChild(d);
  scrollConvo();
}

$('copyBtn').onclick = async () => {
  const lines = [...$('convo').querySelectorAll('.turn')].map((t) => {
    const who = t.classList.contains('user') ? 'ลูกค้า' : 'ผู้ช่วย';
    const bubble = t.querySelector('.bubble');
    const unheard = bubble.querySelector('.unheard');
    if (!unheard) return who + ': ' + bubble.textContent.trim();
    // Keep the copied transcript honest: the dimmed tail was generated but
    // never spoken, so it must not read as part of what the guest heard.
    const spoken = bubble.textContent.slice(0, bubble.textContent.length - unheard.textContent.length);
    return who + ': ' + spoken.trim() + ' [ไม่ได้พูด: ' + unheard.textContent.trim() + ']';
  });
  if (!lines.length) return;
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    $('copyBtn').textContent = 'Copied';
    setTimeout(() => { $('copyBtn').textContent = 'Copy'; }, 1400);
  } catch {
    $('copyBtn').textContent = 'Failed';
    setTimeout(() => { $('copyBtn').textContent = 'Copy'; }, 1400);
  }
};

// ---------------- UI state ----------------

function setState(s) {
  $('stateLabel').textContent = s;
  $('stateLabel').className = 'state ' + s;
  $('callOrb').className = 'orb '
    + (['listening', 'hearing', 'speaking', 'sleep'].includes(s) ? s : '');
  // The right-hand button is the same button in both worlds: it ends a
  // conversation, or it starts one. Two buttons in two screens is what the
  // page used to have, and every "which screen do we go back to" bug came
  // out of keeping them in sync.
  // "Is there a call right now", not "is the state literally sleep" — every
  // other way out (ended, error, superseded) leaves the same page with the
  // same person in front of it and nothing to end. A superseded tab getting
  // this button back is on purpose: pressing it is the deliberate takeover
  // the old picker offered as "กด Start เพื่อใช้แท็บนี้แทน".
  // The kiosk orb runs off the same state word rather than a second copy of
  // the rules — two clocks for one thing is this project's most repeated
  // bug, and an orb that disagrees with the line above it is that bug in
  // miniature.
  $('kOrb').className = 'orb ' + (['listening', 'hearing', 'speaking'].includes(s) ? s : '');
  document.body.classList.toggle('live',
    ['listening', 'hearing', 'speaking', 'muted'].includes(s));
  const inCall = ['connecting', 'listening', 'hearing', 'speaking', 'muted'].includes(s);
  $('endBtn').textContent = inCall ? 'End' : 'เริ่มคุย';
  $('muteBtn').style.visibility = inCall ? '' : 'hidden';
  if (kioskMode) {
    $('kHint').textContent = inCall ? 'แตะเพื่อวางสาย' : 'แตะเพื่อพูด';
    $('kOnline').textContent = inCall ? 'ออนไลน์' : 'พร้อมใช้งาน';
    // A finished visit must not leave its last instruction on a screen the
    // next person walks up to.
    if (s === 'sleep') { kioskAction(''); kioskSay(''); }
  }
}

// ---------------- "is it hearing me?" ----------------
// The honest answer has to come from the microphone, not the server: waiting
// for a transcript means a round trip, and during it the UI sits on
// LISTENING with nothing moving, which reads as "it isn't picking me up".
// This drives the orb straight off the mic level, so feedback is immediate.

const SPEECH_LEVEL = 0.02;   // RMS above this counts as speech, for display only
const QUIET_MS = 700;        // how long to keep showing "hearing" after it drops
let lastLoudAt = 0;
let quietTimer = null;

function onMicLevel(rms) {
  const pct = Math.min(100, Math.round(rms * 400));
  $('levelBar').style.width = pct + '%';
  // Asleep the bar moves and nothing else does. Driving the state off the
  // standby microphone would make the line look like it was listening to a
  // conversation it is not in — and the point of showing the bar here is to
  // prove the microphone works, not to pretend a call is running.
  if ($('stateLabel').textContent === 'sleep') return;
  if (muted || playing) return;

  if (rms >= SPEECH_LEVEL) {
    lastLoudAt = Date.now();
    if ($('stateLabel').textContent !== 'hearing') setState('hearing');
    if (quietTimer) { clearTimeout(quietTimer); quietTimer = null; }
  } else if (!quietTimer && $('stateLabel').textContent === 'hearing') {
    quietTimer = setTimeout(() => {
      quietTimer = null;
      if (!playing && Date.now() - lastLoudAt >= QUIET_MS) setState('listening');
    }, QUIET_MS);
  }
}

// ---------------- mic capture ----------------
// Resamples from the AudioContext rate to whatever the provider wants
// (Gemini 16kHz, OpenAI 24kHz) and emits ~40ms PCM16 chunks.

const WORKLET_SRC = `
class Cap extends AudioWorkletProcessor {
  constructor(o) {
    super();
    const p = (o && o.processorOptions) || {};
    this.target = p.targetRate || 16000;
    this.ratio = sampleRate / this.target;
    this.acc = 0; this.pending = [];
    // 20ms per message. Google's Live API guidance is 20-40ms and
    // explicitly warns against buffering more before sending; 20ms is the
    // low-latency end of that range.
    this.chunk = Math.round(this.target * 0.02);
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) {
      for (let i = 0; i < ch.length; i++) {
        this.acc += 1;
        if (this.acc >= this.ratio) {
          this.acc -= this.ratio;
          const s = Math.max(-1, Math.min(1, ch[i]));
          this.pending.push(s < 0 ? s * 0x8000 : s * 0x7fff);
        }
      }
      // Loudness of this block, reported separately from the audio so the
      // UI can show the guest they're being heard without waiting for a
      // server round trip.
      let sum = 0;
      for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
      this.port.postMessage({ level: Math.sqrt(sum / ch.length) });
      while (this.pending.length >= this.chunk) {
        const f = this.pending.splice(0, this.chunk);
        const a = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) a[i] = f[i];
        this.port.postMessage(a.buffer, [a.buffer]);
      }
    }
    return true;
  }
}
registerProcessor('cap', Cap);
`;

// ---------------- playback ----------------

function playChunk(arrayBuffer) {
  if (!audioCtx || arrayBuffer.byteLength < 2) return;
  // A page parked overnight can have its context suspended long after the
  // call opened fine — transcript moves, speakers stay silent. resume() is
  // idempotent and cheap; state !== 'running' is the one signal this side
  // ever gets, so check it on every chunk, not only at call start.
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  const i16 = new Int16Array(arrayBuffer);
  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / (i16[i] < 0 ? 0x8000 : 0x7fff);

  const buf = audioCtx.createBuffer(1, f32.length, outputRate);
  buf.copyToChannel(f32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  // playHead being well ahead of currentTime is normal and required: the
  // model generates a reply far faster than realtime, so chunks queue up
  // back-to-back. Do NOT "correct" that — snapping playHead back to now
  // makes later chunks start on top of already-scheduled ones and the reply
  // turns into overlapping garbage. It's reset explicitly instead, in
  // startCall() and stopPlayback().
  const at = Math.max(audioCtx.currentTime, playHead);
  src.start(at);
  playHead = at + buf.duration;
  sources.push(src);
  reportAudioLead();
  playing = true;
  setState('speaking');
  src.onended = () => {
    sources = sources.filter((s) => s !== src);
    if (!sources.length) { playing = false; setState('listening'); }
  };
}

// Barge-in. Returns how many ms of the reply the guest actually heard —
// OpenAI needs that to truncate; Gemini discards the rest server-side.
function stopPlayback() {
  const queuedMs = audioCtx ? Math.max(0, (playHead - audioCtx.currentTime) * 1000) : 0;
  sources.forEach((s) => { try { s.stop(); } catch {} });
  sources = [];
  playing = false;
  if (audioCtx) playHead = audioCtx.currentTime;
  lastReportedLead = -1;
  reportAudioLead();          // barge-in emptied the queue
  return Math.max(0, Math.round(sentMs - queuedMs));
}

// ---------------- call ----------------

function releaseCallHardware() {
  try { worklet && (worklet.port.onmessage = null, worklet.disconnect()); } catch {}
  try { micSource && micSource.disconnect(); } catch {}
  micStream && micStream.getTracks().forEach((t) => t.stop());
  sources.forEach((s) => { try { s.stop(); } catch {} });
  sources = []; playing = false;
  audioCtx && audioCtx.close().catch(() => {});
  audioCtx = micStream = micSource = worklet = null;
}

// ---------------- sleeping ----------------
// One screen, one state machine. There used to be two screens, and every
// path that ended a call had to decide which one to go back to — the end
// button, the superseded close, the idle park, the wake rearm. Four
// decisions, made in four places, each one already the subject of a bug.
// Now they all call this.

//: Minutes the finished conversation stays on screen (server: /health).
let transcriptKeepMin = 5;
let wipeTimer = null;
//: When the line last went to sleep, so a reconnect can tell "same visit,
//: carry on" from "a stranger walked up an hour later".
let sleptAt = 0;

function goToSleep(note) {
  // Belt and braces: ws.onclose already released it before any branch, but
  // goToSleep is also reached from the End button and from boot, where no
  // socket closed at all.
  //
  // `releaseCallHardware()` used to be called only on the way *in*, from
  // startCall(). Every way *out* — idle timeout, go_away, a dropped
  // network — left the call's getUserMedia stream, its worklet and its
  // AudioContext alive, and then startWakeMode() opened a second capture on
  // the same device while the first still held it. Windows hands the second
  // one digital silence: peak=0.0000 for sixteen seconds in the log, which
  // is not a quiet room — a live microphone never reads exactly zero — and
  // then real audio the moment the abandoned stream was finally collected.
  //
  // The symptom was "เรียก emma แล้วไม่ได้ยิน", and it was not the wake word
  // at all: the ears were listening to a microphone nobody was holding.
  releaseCallHardware();
  // Never bounce to the picker: this page has one screen now.
  $('pickerScreen').classList.remove('active', 'standby');
  $('callScreen').classList.add('active');
  finalizeAll();
  setState('sleep');
  // The stage goes with the call. The server already wipes its own state on
  // handover (slides, the ROI sheet), but the *screen* kept showing the
  // last guest's unit card, plan, or ROI numbers to whoever walked up next
  // — the transcript-privacy rule with a picture instead of words. Found in
  // review, not in a report, which is the cheap way to find it.
  clearFrame();
  // Zero the bar on the way in. The call that just ended left its last
  // reading there, and a bar showing 5% from a minute ago is worse than no
  // bar: it is the standby microphone's answer to "can you hear me" given
  // by a microphone that is already closed.
  $('levelBar').style.width = '0%';
  $('convo').classList.add('slept');
  if (note) systemLine(note);
  sleptAt = Date.now();
  scheduleTranscriptWipe();
  // Rearm the ears last: startWakeMode paints its own note, and painting it
  // before the state is set would be overwritten by the line above.
  if (wakeAvailable) setTimeout(startWakeMode, 500);
}

function scheduleTranscriptWipe() {
  if (wipeTimer) clearTimeout(wipeTimer);
  wipeTimer = null;
  // Zero means "this screen is somewhere only one person reaches" — the
  // owner's desk. The showroom must not use it.
  if (!transcriptKeepMin) return;
  wipeTimer = setTimeout(() => {
    wipeTimer = null;
    // Only wipe if still asleep. A conversation that resumed while the
    // timer was running is not stale, and clearing it mid-sentence would
    // be the rudest possible moment.
    if ($('stateLabel').textContent !== 'sleep') return;
    $('convo').innerHTML = '';
    liveTurn.user = liveTurn.bot = null;
    cutBot = null;
  }, transcriptKeepMin * 60000);
}

function startCall() {
  manualEnd = false;
  idleParked = false;
  superseded = false;
  standDown = false; standDownReason = '';
  try { ws && ws.close(); } catch {}
  releaseCallHardware();
  if (!wakeHandover) stopWakeMode();   // in a handover the standby mic is
                                       // still buffering the command tail
  $('pickerScreen').classList.remove('active');
  $('callScreen').classList.add('active');
  const v = voices[idx];
  $('callOrb').style.setProperty('--c1', v.gradient[0]);
  $('callOrb').style.setProperty('--c2', v.gradient[1]);
  setState('connecting');
  // Wiping unconditionally was right when a call always began from the
  // picker. It isn't now: someone who says the name again a minute later is
  // continuing the same visit, and having their own last question vanish as
  // they ask the follow-up reads as the machine forgetting them. Inside the
  // keep window the thread stays and gets a divider; past it — or with the
  // window disabled — a new call starts clean, because by then the person
  // in front of the screen may well be someone else.
  const sameVisit = sleptAt && transcriptKeepMin
    && (Date.now() - sleptAt) < transcriptKeepMin * 60000
    && $('convo').children.length;
  if (wipeTimer) { clearTimeout(wipeTimer); wipeTimer = null; }
  $('convo').classList.remove('slept');
  if (sameVisit) {
    const rule = document.createElement('div');
    rule.className = 'convo-divider';
    rule.textContent = '— คุยต่อ —';
    $('convo').appendChild(rule);
  } else {
    $('convo').innerHTML = '';
  }
  sleptAt = 0;
  liveTurn.user = liveTurn.bot = null;
  cutBot = null;
  if (pendingSlideTimer) clearTimeout(pendingSlideTimer);
  pendingSlide = null; pendingSlideTimer = null;
  sentMs = 0;
  // A fresh AudioContext restarts currentTime near 0. Carrying the previous
  // call's playHead over would schedule every chunk far in the future, so
  // the next session plays nothing at all.
  playHead = 0;
  sources = [];
  playing = false;
  muted = false;
  $('muteBtn').textContent = 'Mute';
  showStage(null);
  warnedNoDisplay = false;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  // ?profile=translator on the page URL flips this connection's persona —
  // a bookmark per mode, no .env edit, no restart.
  const urlq = new URLSearchParams(location.search);
  const urlProfile = urlq.get('profile'), urlLang = urlq.get('lang'), urlToken = urlq.get('token');
  ws = new WebSocket(`${proto}://${location.host}/ws?voice=${encodeURIComponent(selectedVoice)}`
    + (urlProfile ? `&profile=${encodeURIComponent(urlProfile)}` : '')
    + (urlLang ? `&lang=${encodeURIComponent(urlLang)}` : '')
    + (urlToken ? `&token=${encodeURIComponent(urlToken)}` : ''));
  ws.binaryType = 'arraybuffer';
  ws.onmessage = onMessage;
  ws.onerror = () => { setState('error'); systemLine('เชื่อมต่อไม่สำเร็จ · connection error'); };
  ws.onclose = () => {
    // Before any branch, because the branches are where this keeps getting
    // lost. The socket closing *is* the call ending, whatever the reason,
    // and a call that has ended has no business still holding the machine's
    // microphone.
    //
    // Put in goToSleep() first, which covered the idle and go_away exits and
    // missed the two that return early — superseded and unauthorized. A tab
    // that lost the robot to another tab went on holding the microphone for
    // ever, so the tab that *won* got digital silence from Windows:
    // peak=0.0000 on the standby socket and "no guest speech for 123s" on
    // the call, both at once, on a desktop with several tabs open.
    //
    // One owner, one place, ahead of every branch — the same shape the End
    // button's hand-rolled copy of this teardown had to be collapsed into.
    releaseCallHardware();
    if ($('callScreen').classList.contains('active')) { finalizeAll(); setState('ended'); }
    if (standDown) {
      // Fully passive: no redial (that steals the session back) and no wake
      // standby (two standby tabs both dial on one "Emma" — same war,
      // slower). Stay on the one screen and let a deliberate press of the
      // button be the takeover.
      const why = standDownReason;
      standDown = false; standDownReason = ''; superseded = false;
      modeRestart = false;   // a lost tab must not redial for a mode switch
      clearFrame();          // a dormant tab must not keep a guest's screen up
      $('convo').classList.add('slept');
      finalizeAll();
      // The reason decides both the state word and whether anything more is
      // worth saying. onMessage has already written the real explanation;
      // adding a second, different one here is what produced "you need a
      // token" above "another tab is using it" on a page with neither.
      if (why === 'superseded') {
        setState('superseded');
        systemLine('ปิดแท็บนั้นแล้วรีโหลดหน้านี้เพื่อใช้งานต่อ');
      } else {
        setState('error');
      }
      sleptAt = Date.now();
      scheduleTranscriptWipe();
      return;
    }
    if (modeRestart) {
      // The translator switch flipped mid-call. The teardown above has run
      // and the microphone is free; dial again — startCall() reads the new
      // ?profile/?lang from the URL the switch just wrote. After standDown,
      // deliberately: a tab that lost the robot must stay lost, whatever
      // mode it wanted next.
      modeRestart = false;
      startCall();
      return;
    }
    if (autoConnect && !manualEnd && !idleParked) {
      // Redial with backoff: 2s doubling to 30s, reset on 'ready'. The cap
      // matters — a server that is down must not be hammered twice a
      // second, and a key that stopped working must not melt the quota the
      // moment it comes back.
      const wait = redialDelay;
      redialDelay = Math.min(redialDelay * 2, 30000);
      setTimeout(() => {
        if (!ws || (ws.readyState !== WebSocket.OPEN &&
                    ws.readyState !== WebSocket.CONNECTING)) startCall();
      }, wait);
      return;
    }
    // The session is gone (idle timeout, go_away, network). Rearm the name
    // after a beat — immediately would race the tail of Emma's last audio
    // still leaving the speaker, and she would answer herself.
    setTimeout(() => {
      if (!ws || (ws.readyState !== WebSocket.OPEN &&
                  ws.readyState !== WebSocket.CONNECTING)) goToSleep();
    }, 1500);
  };
}

async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: micNS, autoGainControl: micAGC },
    });
  } catch (e) {
    setState('error');
    systemLine('ไม่ได้รับสิทธิ์ใช้ไมโครโฟน · microphone permission denied');
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: outputRate });
  await audioCtx.resume();
  // Auto-connect means this can all happen before the person has ever
  // touched the page — and Chrome keeps an AudioContext suspended until the
  // first gesture, so Emma "speaks" into a muted context: transcript moves,
  // speakers stay silent, mic hears nothing. Detect it, say it on screen,
  // and let the first tap anywhere unlock both directions.
  armAudioUnlock(audioCtx);
  // And keep watching after the start: overnight power saving can suspend
  // the context hours into a standby without another gesture ever coming.
  audioCtx.onstatechange = () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  };
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  micSource = audioCtx.createMediaStreamSource(micStream);
  const shaped = buildMicChain(audioCtx, micSource, micCallBoost);
  worklet = new AudioWorkletNode(audioCtx, 'cap', { processorOptions: { targetRate: inputRate } });
  worklet.port.onmessage = (e) => {
    if (e.data && e.data.level !== undefined) {
      onMicLevel(e.data.level);
      return;
    }
    if (muted || !ws || ws.readyState !== WebSocket.OPEN) return;
    // Half-duplex: don't feed the mic upstream while the assistant is
    // speaking, so its own voice coming back through the speakers can't be
    // mistaken for the guest interrupting. Costs barge-in, which is why
    // it's opt-in.
    if (halfDuplex && playing) return;
    ws.send(e.data);
  };
  // Deliberately not connected to destination — never echo the guest's mic.
  shaped.connect(worklet);

  if (wakeHandover) {
    // Everything said since the name, oldest first, then release the
    // standby mic for real. Only at 16kHz — the buffer was captured for the
    // wake model's rate, and flushing it into a 24kHz (OpenAI) session
    // would play the owner's voice at the wrong speed.
    if (inputRate === 16000 && ws && ws.readyState === WebSocket.OPEN) {
      for (const chunk of wakeTail) ws.send(chunk);
    }
    stopWakeMode();
  }
  setState('listening');
}

function onMessage(msg) {
  if (msg.data instanceof ArrayBuffer) {
    // First chunk of a fresh reply: any late transcript from here on belongs
    // to this new turn, not to the one the guest talked over.
    if (sentMs === 0) cutBot = null;
    sentMs += (msg.data.byteLength / 2 / outputRate) * 1000;
    playChunk(msg.data);
    return;
  }

  let evt;
  try { evt = JSON.parse(msg.data); } catch { return; }

  switch (evt.type) {
    case 'ready':
      redialDelay = 2000;
      inputRate = evt.input_rate;
      outputRate = evt.output_rate;
      providerName = evt.provider;
      halfDuplex = !!evt.half_duplex;
      $('callNote').textContent =
        (evt.profile && evt.profile !== 'condo' ? `โหมด ${evt.profile} · ` : '')
        + `${evt.provider} · ${evt.voice} · `
        + (evt.auto_resumes
            ? `auto-continues past ${evt.session_limit_min} min`
            : `session ends after ${evt.session_limit_min} min`)
        + (halfDuplex ? ' · half-duplex (no barge-in)' : '');
      startMic();
      break;

    case 'speech_started':
      // Only barge-in if a reply is actually playing; otherwise this is just
      // the guest starting to talk, and the local level meter already showed
      // that before this event crossed the network.
      if (playing) {
        const heard = stopPlayback();
        const ratio = sentMs > 0 ? heard / sentMs : 1;
        sentMs = 0;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'played', heard_ms: heard }));
        }
        finalizeTurn('user');
        finalizeTurn('bot', { interrupted: true, spokenRatio: ratio });
        // The audio it was waiting behind has just been thrown away.
        applyPendingSlide();
      }
      setState('hearing');
      break;

    case 'interrupted': {
      const heardMs = stopPlayback();
      const ratio = sentMs > 0 ? heardMs / sentMs : 1;
      sentMs = 0;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'played', heard_ms: heardMs }));
      }
      // The reply was cut off — close its bubble and label it so the
      // transcript doesn't imply the guest heard the whole thing. The guest
      // is starting a fresh utterance, so close theirs too.
      finalizeTurn('user');
      finalizeTurn('bot', { interrupted: true, spokenRatio: ratio });
      applyPendingSlide();
      setState('hearing');
      break;
    }

    // Deliberately do NOT close the other side's bubble here. Transcripts
    // arrive out of order, so treating "the guest's text arrived" as "the
    // reply must be finished" chopped a single spoken sentence into two
    // bubbles with a guest bubble wedged between them ("Alright, let me
    // switch languages" / "for you.Sure!"). Only turn_complete and
    // interrupted end a bubble.
    case 'user_transcript':
      appendText('user', evt.text);
      break;

    case 'assistant_transcript':
      appendText('bot', evt.text);
      break;

    case 'tool_result': {
      // Show what physically happened. If the IR command didn't reach the
      // hub, the model may still say "done" — the guest needs to see that
      // the room didn't actually change.
      const r = evt.result || {};
      const label = TOOL_LABELS[evt.name] || evt.name;
      let line = label;
      if (r.hardware === 'failed') line += ' — ส่งสัญญาณไม่สำเร็จ · hardware not reached';
      else if (r.hardware === 'mock') line += ' — จำลอง (ยังไม่ต่ออุปกรณ์จริง) · simulated';
      else if (r.ok === false) line += ' — ' + (r.error || 'failed');
      else line += ' — สำเร็จ · done';
      systemLine(line, r.embed ? { embed: r.embed }
                     : (r.screen === 'unit' && r.unit ? { unit: r.unit } : null));
      // Only successes reach the public screen. "ค้นข้อมูล — ส่งสัญญาณไม่
      // สำเร็จ" is a line for the operator; a guest reading it learns only
      // that the robot is broken, which is the opposite of what the chip is
      // there to say.
      if (r.ok !== false && r.hardware !== 'failed') kioskAction(label);
      // "เปิดยูทูบ..." lands here as a URL the server has already decided is
      // frameable. Showing it in this page is the whole point — a second
      // window opening on top of the one being used is what the owner asked
      // not to happen.
      if (r.embed) showFrame(r.embed);
      if (r.screen === 'unit' && r.unit) showUnit(r.unit);
      if (r.screen === 'calc') showCalc(r);
      if (r.screen === 'unitlist') showUnitList(r);
      if (r.screen === 'plan') showPlan(r);
      if (r.screen === 'clear') clearFrame();

      if ('slide' in evt) scheduleSlide(evt.slide, evt.displays);
      break;
    }

    case 'turn_complete':
      finalizeAll();
      sentMs = 0;
      cutBot = null;
      break;

    case 'idle_timeout':
      // The room went quiet and the server hung up to stop the meter.
      idleParked = true;
      systemLine('เงียบไปพักหนึ่ง เลยวางสายให้ก่อน — เรียก "emma" เมื่อไหร่ก็กลับมาค่ะ');
      break;

    case 'farewell':
      // The owner said goodbye and Emma hung up herself. Same parking as
      // idle — redialing a call the owner just ended would be the robot
      // refusing to be dismissed.
      idleParked = true;
      systemLine('วางสายแล้วค่ะ — เรียก "emma" เมื่อไหร่ก็กลับมา');
      break;

    case 'error':
      if (evt.code === 'unauthorized') {
        // Wrong/missing token: stand down completely. Redialing an auth
        // failure every two seconds is a polite little brute-force loop.
        standDown = true; standDownReason = 'unauthorized';
        setState('error');
        systemLine(evt.message || 'ต้องใส่ token');
        break;
      }
      if (evt.code === 'superseded') {
        standDown = true; standDownReason = 'superseded';
        superseded = true;
        setState('ended');
        systemLine('แท็บอื่นกำลังใช้งานอยู่ — ปิดแท็บนั้น หรือกด Start เพื่อใช้แท็บนี้แทน');
        break;
      }
      setState('error');
      systemLine(evt.message || 'unknown error');
      break;
  }
}

$('muteBtn').onclick = () => {
  muted = !muted;
  $('muteBtn').textContent = muted ? 'Unmute' : 'Mute';
  setState(muted ? 'muted' : (playing ? 'speaking' : 'listening'));
};

// ==================== translator switch ====================
// One source of truth: the page URL. startCall() already reads
// ?profile/?lang from location.search on every dial, and the bookmark form
// (/?profile=translator&lang=ru) must keep working unchanged — so the
// switch *edits the URL* rather than keeping a mode variable that could
// disagree with it. Mirrors _LANG_NAMES in app/prompts.py minus Thai; a
// test cross-checks the two so they cannot drift apart.
const TRANSLATOR_LANGS = {
  en: 'อังกฤษ', zh: 'จีน', ja: 'ญี่ปุ่น', ko: 'เกาหลี', ru: 'รัสเซีย',
  ar: 'อาหรับ', fr: 'ฝรั่งเศส', de: 'เยอรมัน', es: 'สเปน', hi: 'ฮินดี',
  id: 'อินโดนีเซีย', vi: 'เวียดนาม', my: 'พม่า', km: 'เขมร', lo: 'ลาว',
  ms: 'มาเลย์',
};
let modeRestart = false;      // set by the switch, consumed in ws.onclose

function translatorOn() {
  return new URLSearchParams(location.search).get('profile') === 'translator';
}

function paintTranslator() {
  const on = translatorOn();
  $('translatorBtn').classList.toggle('on', on);
  $('langSel').hidden = !on;
}

function setTranslator(on, lang) {
  const q = new URLSearchParams(location.search);
  if (on) {
    q.set('profile', 'translator');
    q.set('lang', lang || $('langSel').value || 'en');
  } else {
    q.delete('profile'); q.delete('lang');
  }
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : ''));
  paintTranslator();
  const inCall = ['connecting', 'listening', 'hearing', 'speaking', 'muted']
      .includes($('stateLabel').textContent);
  if (inCall) {
    // Restart through the close path, never over a live socket: the old
    // socket's onclose releases the microphone unconditionally, and a new
    // call dialed before it fires would have its mic pulled from under it.
    modeRestart = true;
    try { ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({ type: 'stop' })); } catch {}
    try { ws && ws.close(); } catch {}
  } else {
    systemLine(on
      ? `โหมดล่ามพร้อม (ไทย ↔ ${TRANSLATOR_LANGS[q.get('lang')] || 'อังกฤษ'}) — เริ่มคุยได้เลย`
      : 'กลับโหมดผู้ช่วยปกติแล้ว');
  }
}

$('translatorBtn').onclick = () => setTranslator(!translatorOn());
$('langSel').onchange = () => setTranslator(true, $('langSel').value);
(function initTranslatorUI() {
  const sel = $('langSel');
  for (const [code, name] of Object.entries(TRANSLATOR_LANGS)) {
    const o = document.createElement('option');
    o.value = code; o.textContent = 'ไทย ↔ ' + name;
    sel.appendChild(o);
  }
  const fromUrl = new URLSearchParams(location.search).get('lang');
  if (fromUrl && TRANSLATOR_LANGS[fromUrl]) sel.value = fromUrl;
  paintTranslator();
})();

$('endBtn').onclick = () => {
  // One button, two jobs — see setState(). Asleep it is the Start button
  // the picker screen used to own, which is what keeps a machine with no
  // wake word and no auto-connect (the gallery's defaults) usable at all.
  if (['connecting', 'listening', 'hearing', 'speaking', 'muted']
      .includes($('stateLabel').textContent) === false) {
    startCall();
    return;
  }
  manualEnd = true;
  try { ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({ type: 'stop' })); } catch {}
  try { ws && ws.close(); } catch {}
  // The same teardown, from the one function that owns it. This used to be
  // copied out by hand here — which is how the other exits came to have no
  // teardown at all: nobody noticed the copy was the only one.
  sentMs = 0;
  finalizeAll();
  ws = null;
  goToSleep();
};

$('startBtn').onclick = startCall;

// The kiosk's one big button is the same decision the End/เริ่มคุย button
// makes, in a shape a stranger can use without reading anything: in a call
// it hangs up, out of one it starts. Routed through the existing handler so
// there is one implementation, not a second that drifts.
$('kMic').onclick = () => $('endBtn').click();
$('stageClose').onclick = clearFrame;
$('kHome').onclick = () => {
  // Clear the screen back to the idle face. Local only — it puts nothing on
  // the wire, so a guest tapping it can never interrupt or end the
  // conversation, only stop looking at what is on the stage.
  clearFrame();
  kioskAction('');
};

// Tap the orb to change the voice. A voice is chosen at session start, so
// switching means redialing — the conversation so far doesn't carry over,
// which is the price of the shortcut and worth saying in the panel.
$('callOrb').style.cursor = 'pointer';
$('callOrb').title = 'กดเพื่อเปลี่ยนเสียง · tap to change voice';
$('callOrb').onclick = () => {
  if (!voices.length) return;
  idx = (idx + 1) % voices.length;
  selectedVoice = voices[idx].id;
  manualEnd = true;              // this close is ours, not a line drop
  try { ws && ws.close(); } catch {}
  setTimeout(() => {
    startCall();
    systemLine(`เปลี่ยนเสียงเป็น ${voices[idx].name} — เริ่มบทสนทนาใหม่`);
  }, 250);
};

// ---------------- wake mode: "Emma" instead of the Start button ----------------
// Standby ears. While no conversation is running, the mic streams to
// /ws/wake, where the server listens for the assistant's name — locally,
// nothing upstream is connected until the name is heard. On {"type":"wake"}
// this releases the mic and starts the ordinary call.
//
// Strictly an upgrade over the button: any failure (endpoint disabled,
// model missing, mic denied, socket error) drops back to exactly the UI
// that exists today. The button must never stop working because wake mode
// half-loaded.

let wakeWs = null, wakeCtx = null, wakeMicStream = null, wakeWorklet = null;
let wakeAvailable = false, wakeStopping = false;
let wakeServerReady = false, wakeAudioFlowing = false, wakeListeningWord = 'emma';
// The seconds between "Emma" and the session being ready are exactly when
// the owner says the actual command — "Emma เปิดไฟ" is one breath. Dropping
// that audio forces them to wait for the greeting and say it again, which
// is the whole perceived slowness of wake mode. So after the name fires,
// the standby mic keeps capturing into this buffer, and startMic() flushes
// it into the session the moment the socket is up. Gemini reads flushed
// speech as a barge-in of its own greeting, which is precisely right: name
// alone -> greeting plays; name+command -> greeting yields to the answer.
let wakeTail = [], wakeHandover = false;
const WAKE_TAIL_MAX = 300;    // 20ms chunks -> ~6s cap

// Always-connected mode (AUTO_CONNECT in .env): the page opens straight
// into a live session, and a dropped session redials itself. The owner
// chose this over the wake word's quota saving — deliberately, twice.
let autoConnect = false, manualEnd = false, redialDelay = 2000;
// Set when the server hung up because the room went quiet. That close is a
// decision, not a failure — redialing it would turn IDLE_TIMEOUT_S into a
// quota-burning loop, so it parks in standby and the name brings it back.
let idleParked = false;
// Another tab took the robot (the server's newest-wins handover). A
// superseded tab must STAND DOWN — redialing steals the session straight
// back, the other tab redials in turn, and the two burn quota killing each
// other forever. Observed live, 2026-08-24: a translator tab and a normal
// tab ping-ponging takeovers, both showing LISTENING.
// Two different reasons to stand down, and they were sharing one flag —
// which is why an unauthorized page showed SUPERSEDED and two contradicting
// lines: "you need a token" (true) followed by "another tab is using it"
// (invented). `standDown` is the shared decision — do not redial — and
// `standDownReason` is what to say about it.
let superseded = false;
let standDown = false, standDownReason = '';
// Mic shaping (MIC_BOOST / MIC_NOISE_SUPPRESSION in .env): compressor+gain
// between the mic and everything that listens. See buildMicChain().
let micBoost = 1, micCallBoost = 1, micNS = true, micCompressor = true, micAGC = true;

async function startWakeMode() {
  if (!wakeAvailable || wakeWs) return;
  // Chrome only exposes getUserMedia on localhost or a trusted HTTPS
  // origin.  Do not open a standby socket and paint "listening" when this
  // page can never produce audio (the old behaviour looked healthy but sent
  // the detector complete silence).
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    wakeAvailable = false;
    sleepNote('ไมโครโฟนใช้ไม่ได้บน HTTP — เปิดหน้านี้ด้วย https:// หรือ localhost');
    return;
  }
  // A handover whose session died before ready leaves the old standby mic
  // buffering into nowhere. Rearming is the moment to reclaim it.
  if (wakeHandover) stopWakeMode();
  wakeStopping = false;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const wakeToken = new URLSearchParams(location.search).get('token');
  const sock = new WebSocket(`${proto}://${location.host}/ws/wake`
    + (wakeToken ? `?token=${encodeURIComponent(wakeToken)}` : ''));
  sock.binaryType = 'arraybuffer';
  wakeWs = sock;

  sock.onmessage = (msg) => {
    let evt;
    try { evt = JSON.parse(msg.data); } catch { return; }
    if (evt.type === 'wake') {
      // Acknowledge *now*, before the dial. Between the name being heard
      // and Emma's greeting there are 2-4 seconds of getUserMedia + WS +
      // Gemini setup, and dead air after a wake word reads as "she didn't
      // hear me" — the owner repeats the name into a session that is
      // already opening. A local chime is the one response that can be
      // instant, because it never leaves this machine.
      playWakeChime();
      sleepNote('ได้ยินแล้วค่ะ — กำลังเปิดสาย…');
      // The name was heard. Keep the standby mic alive but redirect it into
      // the tail buffer; the wake socket itself closes now — the ears' job
      // is done, and a detector listening through the whole conversation
      // would be a hot mic with no purpose.
      wakeHandover = true;
      wakeTail = [];
      if (wakeWorklet) wakeWorklet.port.onmessage = (e) => {
        if (e.data && e.data.level !== undefined) return;
        wakeTail.push(e.data);
        if (wakeTail.length > WAKE_TAIL_MAX) wakeTail.shift();
      };
      try { sock.close(); } catch {}
      startCall();
    } else if (evt.type === 'wake_listening') {
      // Server readiness alone is not enough: getUserMedia/AudioWorklet may
      // still fail.  The standby face is shown only after a real PCM frame
      // has also left the microphone below.
      wakeServerReady = true;
      wakeListeningWord = evt.word || 'emma';
      showWakeStandby(evt.word);
    } else if (evt.type === 'wake_unavailable') {
      wakeAvailable = false;
      stopWakeMode();
    } else if (evt.type === 'error' && evt.code === 'unauthorized') {
      // The same stand-down the call socket does, and it has to be repeated
      // here because the guard there only ever protected /ws. Without it the
      // onclose handler below rearms two seconds later — for ever, with the
      // standby microphone reopened on every pass. An auth failure retried
      // every two seconds is a brute-force loop with a mic attached.
      wakeAvailable = false;
      stopWakeMode();
      sleepNote(evt.message || 'ต้องใส่ token');
    }
  };
  sock.onclose = () => {
    if (wakeWs === sock) wakeWs = null;
    // A dropped standby socket (server restart, sleep/resume) rearms
    // itself; deliberate teardown does not.
    if (!wakeStopping && wakeAvailable &&
        $('pickerScreen').classList.contains('active')) {
      setTimeout(startWakeMode, 2000);
    }
  };
  sock.onerror = () => { try { sock.close(); } catch {} };

  try {
    wakeMicStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: micNS, autoGainControl: micAGC },
    });
  } catch (e) {
    // No permission — the button path stays. Say which mode was lost.
    wakeAvailable = false;
    stopWakeMode();
    sleepNote('กดปุ่ม "เริ่มคุย" ด้านล่าง (ไมค์สำหรับเรียกชื่อไม่ได้รับสิทธิ์)');
    return;
  }
  wakeCtx = new (window.AudioContext || window.webkitAudioContext)();
  await wakeCtx.resume();
  armAudioUnlock(wakeCtx);
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
  await wakeCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  const src = buildMicChain(wakeCtx, wakeCtx.createMediaStreamSource(wakeMicStream));
  // The KWS model is 16kHz regardless of which voice provider is active.
  wakeWorklet = new AudioWorkletNode(wakeCtx, 'cap', { processorOptions: { targetRate: 16000 } });
  wakeWorklet.port.onmessage = (e) => {
    if (e.data && e.data.level !== undefined) {
      // The standby mic used to throw this away, and the standby *screen*
      // had no bar to put it in. That is why "พูด emma แล้วเหมือนไม่ได้ยิน"
      // was undiagnosable from the page: a muted microphone and a
      // mispronounced name looked exactly alike. Now the same bar that
      // proves the mic works during a call proves it while asleep.
      onMicLevel(e.data.level);
      return;
    }
    if (!wakeAudioFlowing) {
      wakeAudioFlowing = true;
      showWakeStandby();
    }
    if (wakeWs && wakeWs.readyState === WebSocket.OPEN) wakeWs.send(e.data);
  };
  src.connect(wakeWorklet);
  // Keep the worklet in Chrome's render graph. Some builds suspend a node
  // with no route to destination even though we consume its MessagePort.
  // Zero gain keeps it scheduled without ever echoing the microphone.
  const silent = wakeCtx.createGain();
  silent.gain.value = 0;
  wakeWorklet.connect(silent);
  silent.connect(wakeCtx.destination);
}

function showWakeStandby(word = null) {
  // Both halves still required: the server saying it is listening does not
  // mean this page ever produced a sample. Only now the claim is checkable
  // by the person reading it — the level bar is right underneath.
  if (!wakeServerReady || !wakeAudioFlowing) return;
  const name = word || wakeListeningWord;
  sleepNote(`ไมค์กำลังฟังอยู่ — เรียก "${name}" ได้เลยค่ะ`);
}

function sleepNote(text) {
  // The status line of the one screen. Written straight rather than through
  // systemLine() because this is the line's own condition, not something
  // that was said in the conversation — it must not end up in the
  // transcript the Copy button hands over.
  $('callNote').textContent = text;
}

function buildMicChain(ctx, source, boost = micBoost) {
  // Far-field recipe: squeeze the dynamic range (so far/quiet speech and
  // near/loud speech land closer together), then lift the result. With
  // boost=1.0 the chain is skipped entirely — the audio path stays
  // byte-identical to what it always was. The caller picks which knob:
  // standby passes the default (reach), the call passes micCallBoost —
  // the same compressor that lets the name carry across the room also
  // lifts everyone else's conversation into the call.
  if (boost === 1) return source;
  const gain = ctx.createGain();
  gain.gain.value = boost;
  if (!micCompressor) {
    // MIC_COMPRESSOR=false: plain gain. The compressor lifts everything
    // quiet — including the room's own noise floor, measured sitting right
    // at the "speech" bar with nobody talking. Gain alone scales speech
    // and noise together instead of letting noise catch up.
    source.connect(gain);
    return gain;
  }
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -45;   // start squeezing well below speech peaks
  comp.knee.value = 30;
  comp.ratio.value = 8;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;
  source.connect(comp);
  comp.connect(gain);
  return gain;
}

function playWakeChime() {
  // Two soft rising tones, ~0.3s, through the wake AudioContext — which is
  // already resumed and unlocked, because it has been capturing the mic.
  // Kept synthesized rather than a file: nothing to load, nothing to 404,
  // and it works exactly when the wake path works.
  try {
    const ctx = wakeCtx;
    if (!ctx || ctx.state !== 'running') return;
    const t0 = ctx.currentTime;
    [[660, 0], [880, 0.12]].forEach(([freq, at]) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.18);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0 + at); osc.stop(t0 + at + 0.2);
    });
  } catch {}   // a missed chime must never block the dial
}

function armAudioUnlock(ctx) {
  if (!ctx || ctx.state !== 'suspended') return;
  const note = 'callNote';   // one screen, one status line
  const prev = $(note).textContent;
  $(note).textContent = 'แตะหน้าจอหนึ่งครั้งเพื่อเปิดเสียง · tap once to enable audio';
  const unlock = () => {
    ctx.resume().then(() => { if ($(note).textContent.includes('แตะหน้าจอ')) $(note).textContent = prev; });
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
  };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
}

function stopWakeMode() {
  wakeStopping = true;
  // A bar frozen at its last value is a lie about a microphone that is no
  // longer open, and this bar's whole job is to be believed.
  $('levelBar').style.width = '0%';
  wakeServerReady = false;
  wakeAudioFlowing = false;
  wakeHandover = false;
  wakeTail = [];
  // The picker is the fallback; whenever the ears close, it returns whole.
  $('pickerScreen').classList.remove('standby');
  try { wakeWorklet && (wakeWorklet.port.onmessage = null, wakeWorklet.disconnect()); } catch {}
  wakeMicStream && wakeMicStream.getTracks().forEach((t) => t.stop());
  try { wakeWs && wakeWs.close(); } catch {}
  wakeCtx && wakeCtx.close().catch(() => {});
  wakeWs = wakeCtx = wakeMicStream = wakeWorklet = null;
}
</script>
</body>
