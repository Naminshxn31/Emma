<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Emma — Embassy AI Concierge</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Inline so the browser never issues a /favicon.ico request (which would
     otherwise 404 on every page load and clutter the server log). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='32%25' cy='28%25'%3E%3Cstop offset='0' stop-color='%238ED0F5'/%3E%3Cstop offset='0.78' stop-color='%231B6FE0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
         background: #fff; color: #0d0d0d; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; padding: 1.5rem 1rem; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #f2f2f2; } }

  .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
  .screen.active { display: flex; }
  #pickerScreen { max-width: 420px; }
  /* Widens to two columns only once a slide is on screen, so a plain
     conversation isn't left with an empty half. */
  #callScreen { max-width: 560px; height: calc(100vh - 3rem);
                transition: max-width .3s ease; }
  #callScreen.with-slides { max-width: 1500px; }

  h1 { font-size: 2rem; font-weight: 700; margin: 0 0 .5rem; text-align: center; letter-spacing: -0.02em; }
  .sub { font-size: .8rem; color: #8e8e8e; margin: 0 0 2.5rem; text-align: center; }
  .pill { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .06em;
          background: rgba(30,160,90,.14); color: #1a8f52; padding: .18rem .5rem; border-radius: 99px; }

  .orb { border-radius: 50%; flex-shrink: 0;
         transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
         background: radial-gradient(circle at 32% 28%, var(--c1) 0%, var(--c2) 78%); }
  #pickOrb { width: 210px; height: 210px; }
  #callOrb { width: 76px; height: 76px; }
  .carousel { display: flex; align-items: center; gap: .75rem; width: 100%; justify-content: center; }
  .arrow { border: none; background: transparent; font-size: 1.7rem; line-height: 1; cursor: pointer;
           color: #8e8e8e; padding: .6rem; border-radius: 50%; }
  .arrow:hover { background: rgba(128,128,128,.14); }
  .voice-name { font-size: 1.4rem; font-weight: 600; margin: 1.5rem 0 .3rem; text-align: center; }
  .voice-desc { font-size: 1rem; color: #8e8e8e; margin: 0; text-align: center; }
  .badge { display: inline-block; font-size: .65rem; font-weight: 700; letter-spacing: .05em;
           background: rgba(27,111,224,.14); color: #1b6fe0; padding: .16rem .45rem;
           border-radius: 99px; margin-left: .45rem; vertical-align: middle; }
  .dots { display: flex; gap: .38rem; margin: 1.5rem 0; flex-wrap: wrap; justify-content: center; max-width: 320px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #d4d4d4; cursor: pointer; border: none; padding: 0; }
  .dot.on { background: #0d0d0d; }
  @media (prefers-color-scheme: dark) { .dot { background: #4a4a4a; } .dot.on { background: #f2f2f2; } }

  .btn { padding: .9rem 1rem; border-radius: 99px; border: none; font-size: .95rem; font-weight: 600;
         cursor: pointer; background: #0d0d0d; color: #fff; font-family: inherit; }
  .btn.wide { width: 100%; padding: 1rem; font-size: 1rem; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: #8e8e8e; border: 1px solid rgba(128,128,128,.35); }
  .btn.ghost.on { color: #3b82f6; border-color: #3b82f6; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .btn { background: #f2f2f2; color: #0d0d0d; } }

  .orb.listening { animation: breathe 2.4s ease-in-out infinite; }
  .orb.hearing   { animation: breathe 1.1s ease-in-out infinite; }
  .orb.speaking  { animation: speak .7s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
  @keyframes speak   { 0%,100% { transform: scale(1) } 50% { transform: scale(1.11) } }

  /* --- call screen --- */
  .callbar { display: flex; align-items: center; gap: 1rem; width: 100%; padding-bottom: 1rem; flex-shrink: 0; }
  .callbar .meta { flex: 1; min-width: 0; }
  .state { font-size: .8rem; color: #8e8e8e; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .state.speaking { color: #1b6fe0; }
  .state.hearing { color: #1a8f52; }
  .state.error { color: #c33; }
  .meta .note { font-size: .74rem; color: #8e8e8e; margin: .25rem 0 0; }
  .level { height: 4px; background: rgba(128,128,128,.22); border-radius: 2px;
           overflow: hidden; margin-top: 7px; max-width: 260px; }
  .level > div { height: 100%; width: 0%; background: #1a8f52; transition: width .06s linear; }

  /* Slides sit beside the conversation, wider than it — the picture is what
     the guest is actually looking at, so it gets the room. */
  .split { display: flex; gap: 1rem; width: 100%; flex: 1; min-height: 0; }
  /* The conversation keeps its normal width on the left and does not grow —
     letting it flex meant it swallowed the row and squeezed the slide into a
     sliver. Extra width belongs to the picture. */
  .col-chat { display: flex; flex-direction: column; min-width: 0;
              flex: 0 0 480px; max-width: 100%; }
  .stage { display: none; position: relative; border-radius: 12px;
           overflow: hidden; background: #000; flex-direction: column; }
  .stage.on { display: flex; flex: 1 1 auto; min-width: 0; }
  .stage-img-wrap { flex: 1; min-height: 0; display: flex; align-items: center;
                    justify-content: center; overflow: hidden; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .stage-bar { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline;
               padding: .5rem .8rem; background: rgba(0,0,0,.72); color: #fff;
               font-size: .82rem; flex-shrink: 0; }
  .stage-bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-bar span:last-child { opacity: .7; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .stage-open { position: absolute; top: .5rem; right: .5rem; background: rgba(0,0,0,.6);
                color: #fff; text-decoration: none; font-size: .72rem; padding: .28rem .6rem;
                border-radius: 99px; }
  .stage-open:hover { background: rgba(0,0,0,.85); }

  /* Not enough width for two columns — stack, with the slide on top. */
  @media (max-width: 900px) {
    .split { flex-direction: column; }
    .col-chat { flex: 1 1 auto; }
    .stage.on { flex: 0 0 auto; max-height: 38vh; }
    #callScreen.with-slides { max-width: 560px; }
  }

  .convo { flex: 1; width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: .7rem;
           padding: 1rem; border: 1px solid rgba(128,128,128,.2); border-radius: 16px;
           background: rgba(128,128,128,.035); min-height: 0; }
  .convo:empty::after { content: 'บทสนทนาจะแสดงที่นี่ — เริ่มพูดได้เลย';
                        color: #a0a0a0; font-size: .85rem; margin: auto; }

  .turn { display: flex; flex-direction: column; max-width: 88%; }
  .turn.user { align-self: flex-end; align-items: flex-end; }
  .turn.bot { align-self: flex-start; align-items: flex-start; }
  .who { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
         color: #9a9a9a; margin-bottom: .25rem; }
  .bubble { padding: .6rem .9rem; border-radius: 16px; font-size: .93rem; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word; }
  .turn.user .bubble { background: #1b6fe0; color: #fff; border-bottom-right-radius: 5px; }
  .turn.bot .bubble { background: #ececec; border-bottom-left-radius: 5px; }
  @media (prefers-color-scheme: dark) { .turn.bot .bubble { background: #262626; } }
  .turn.live .bubble::after { content: '▍'; opacity: .5; margin-left: 1px; }
  .cut { font-size: .68rem; color: #b8860b; margin-top: .25rem; }
  /* Text the model generated but never got to say, because the guest cut in.
     Dimmed and struck through so the panel can't imply it was spoken. */
  .unheard { opacity: .42; text-decoration: line-through;
             text-decoration-thickness: 1px; }

  .controls { display: flex; gap: .5rem; width: 100%; padding-top: 1rem; flex-shrink: 0; }
  .controls .btn { flex: 1; }
  .controls .btn.icon { flex: 0 0 auto; padding: .9rem 1.1rem; }

  .note { font-size: .76rem; color: #8e8e8e; text-align: center; margin-top: 1.1rem; line-height: 1.5; }
  .err { background: rgba(224,60,60,.1); border: 1px solid rgba(224,60,60,.35); color: #c33;
         padding: .8rem 1rem; border-radius: 12px; font-size: .84rem; margin-bottom: 1.4rem;
         width: 100%; line-height: 1.55; }
  .err code { background: rgba(0,0,0,.08); padding: .05rem .3rem; border-radius: 4px; }
  /* Standby: the ears are armed, so the page is a presence, not a form.
     Everything that says "configure me, press me" goes; the orb stays as
     the face, the note says the one thing that matters. Dropping the class
     restores the full picker, so losing wake mode never strands the page. */
  #pickerScreen.standby h1, #pickerScreen.standby .sub,
  #pickerScreen.standby .voice-name, #pickerScreen.standby .voice-desc,
  #pickerScreen.standby .dots, #pickerScreen.standby .arrow,
  #pickerScreen.standby .btn { display: none; }
  #pickerScreen.standby .note { font-size: 1.05rem; }
  #pickerScreen.standby .orb { animation: breathe 4s ease-in-out infinite; }
  /* Sleeping is a state of the conversation screen, not a screen of its
     own. The orb keeps breathing so "waiting for the name" never reads as
     "switched off", and the level bar under it keeps moving — that bar is
     the only honest answer to "is the microphone hearing me at all", and
     the old standby screen was the one place in the app that hid it. */
  .orb.sleep { animation: breathe 4s ease-in-out infinite; }
  /* Faded, not hidden: the conversation that just happened is still worth
     reading, and the fade is what says it is over. */
  .convo.slept { opacity: .5; }
  .convo-divider { text-align: center; font-size: .75rem; color: #999;
                   margin: .9rem 0 .4rem; letter-spacing: .04em; }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .85; }
                       50% { transform: scale(1.06); opacity: 1; } }

  /* ==================== kiosk skin (?kiosk=1) ====================
     The robot's own screen: 18.5" portrait, read standing, one to two
     metres away, by someone who has never seen it before. Everything is
     bigger, darker and calmer than the laptop page it shares markup with.

     Scoped entirely under `body.kiosk`, and the laptop page keeps the exact
     rules it had — the two live in one file because they are one client
     (the screen has the microphone, so it cannot be a passive display), not
     because their styling is similar.

     Sized in vmin/vh rather than px so the panel arriving in the other
     orientation, or at some other resolution, does not need a code change.
     Colours are a first pass at the mock: dark ground, gold accent. */
  body.kiosk { background: #0a0e17; color: #f3ede1; padding: 0;
               overflow: hidden; }
  /* Hidden only once the mouse has stopped, never outright. A touch panel
     has no cursor to begin with, so `cursor: none` bought nothing there and
     cost everything on the desk it is developed on: the pointer vanished
     and the mic button could not be aimed at. */
  body.idlecursor, body.idlecursor * { cursor: none; }
  body.kiosk #callScreen { max-width: none; width: 100vw; height: 100vh;
                           display: grid; gap: 0; padding: 0;
                           grid-template-rows: auto auto 1fr auto; }
  body.kiosk #pickerScreen { display: none !important; }
  /* The laptop furniture has no place here: the state word, the level bar,
     the transcript column and the three buttons are all operator tools. */
  body.kiosk .callbar, body.kiosk .col-chat { display: none; }
  body.kiosk .split { display: block; min-height: 0; }

  .kHead, .kHero, .kFoot { display: none; }
  body.kiosk .kHead, body.kiosk .kHero, body.kiosk .kFoot { display: flex; }

  .kHead { align-items: flex-start; justify-content: space-between;
           padding: 3.5vmin 4vmin 0; }
  .kBrand { font-size: 3.4vmin; font-weight: 600; letter-spacing: .18em;
            color: #e8d9b5; line-height: 1.1; }
  .kBrand small { display: block; font-size: .34em; letter-spacing: .28em;
                  color: #8a8069; margin-top: .7vmin; font-weight: 400; }
  .kStatus { display: flex; align-items: center; gap: 1.6vmin;
             font-size: 2.4vmin; color: #cfc4ab; }
  .kStatus i { width: 1.4vmin; height: 1.4vmin; border-radius: 50%;
               background: #3f4756; transition: background .3s; }
  body.kiosk.live .kStatus i { background: #35c46a; box-shadow: 0 0 1.6vmin #35c46a88; }
  .kStatus b { font-variant-numeric: tabular-nums; font-weight: 600;
               color: #f3ede1; margin-left: .8vmin; }

  .kHero { flex-direction: column; align-items: center; gap: 1.4vmin;
           padding: 2vmin 5vmin 0; text-align: center; }
  .kOrbWrap { position: relative; display: flex; align-items: center;
              justify-content: center; }
  #kOrb { width: 22vmin; height: 22vmin;
          --c1: #fdfbf4; --c2: #c9a96a;
          box-shadow: 0 0 9vmin rgba(201,169,106,.42),
                      0 0 22vmin rgba(201,169,106,.16); }
  .kName { font-size: 5.2vmin; font-weight: 600; letter-spacing: .16em;
           color: #f0e4c8; line-height: 1.15; }
  .kName small { display: block; font-size: .34em; letter-spacing: .06em;
                 color: #9a8f77; }
  .kChip { min-height: 0; font-size: 2.7vmin; color: #f0e4c8;
           border: 1px solid rgba(201,169,106,.55); border-radius: 99px;
           padding: 1.3vmin 4vmin; margin-top: 1vmin;
           background: rgba(201,169,106,.09); opacity: 0;
           transition: opacity .35s ease; }
  .kChip.on { opacity: 1; }
  .kChip:empty { display: none; }
  /* Emma's own words, already paced against the audio clock by the server
     for the robot screen — here they are paced by the browser that is doing
     the speaking, which knows even better. */
  .kSay { font-size: 2.9vmin; line-height: 1.5; color: #d8cdb4;
          max-width: 84vw; min-height: 4.4em; margin-top: 1vmin;
          display: -webkit-box; -webkit-box-orient: vertical;
          -webkit-line-clamp: 3; overflow: hidden; }

  /* The stage is the card in the middle of the mock. Empty it collapses,
     rather than leaving a grey rectangle where a room ought to be. */
  body.kiosk .stage { display: none; margin: 2vmin 4vmin;
                      border-radius: 3vmin; background: #10151f;
                      border: 1px solid rgba(201,169,106,.22); }
  body.kiosk .stage.on { display: flex; }
  body.kiosk .stage-bar { background: rgba(0,0,0,.55); font-size: 2.4vmin;
                          padding: 1.6vmin 2.6vmin; }
  body.kiosk .stage-open { display: none; }

  .kFoot { align-items: center; justify-content: center; position: relative;
           padding: 3vmin 6vmin calc(7vmin + env(safe-area-inset-bottom, 0px)); }
  .kBtn { position: absolute; left: 7vmin; width: 11vmin; height: 11vmin;
          border-radius: 50%; border: 1px solid rgba(201,169,106,.35);
          background: rgba(255,255,255,.03); color: #e8d9b5;
          font-size: 5vmin; line-height: 1; cursor: pointer; }
  .kMic { width: 17vmin; height: 17vmin; border-radius: 50%; border: none;
          cursor: pointer; background: radial-gradient(circle at 34% 30%,
          #f6ecd2 0%, #c9a96a 72%); box-shadow: 0 0 6vmin rgba(201,169,106,.4);
          display: flex; align-items: center; justify-content: center; }
  /* A microphone drawn in CSS: no icon font to load, no image to 404. */
  .kMic span { display: block; width: 4vmin; height: 7vmin; border-radius: 2vmin;
               background: #2a2113; position: relative; }
  .kMic span::after { content: ''; position: absolute; left: 50%; bottom: -3.2vmin;
                      transform: translateX(-50%); width: 7vmin; height: 3.4vmin;
                      border: .8vmin solid #2a2113; border-top: none;
                      border-radius: 0 0 4vmin 4vmin; }
  body.kiosk.live .kMic { animation: micpulse 2.6s ease-in-out infinite; }
  @keyframes micpulse { 0%,100% { box-shadow: 0 0 6vmin rgba(201,169,106,.40) }
                        50%     { box-shadow: 0 0 11vmin rgba(201,169,106,.72) } }
  .kHint { position: absolute; bottom: calc(2vmin + env(safe-area-inset-bottom, 0px));
           font-size: 2.2vmin; color: #8a8069; letter-spacing: .06em; }

  /* Landscape: the same screen on a desk monitor or a panel mounted the
     usual way round. Decided by shape, never by user agent — the Android
     shell may report orientation differently once the robot arrives. */
  @media (min-aspect-ratio: 1/1) {
    body.kiosk #callScreen { grid-template-rows: auto auto 1fr auto; }
    #kOrb { width: 13vmin; height: 13vmin; }
    .kName { font-size: 3.6vmin; }
    .kSay { font-size: 2.2vmin; min-height: 3.2em; -webkit-line-clamp: 2; }
    .kMic { width: 11vmin; height: 11vmin; }
    .kMic span { width: 2.6vmin; height: 4.6vmin; }
    .kMic span::after { width: 4.6vmin; height: 2.2vmin; bottom: -2.1vmin;
                        border-width: .55vmin; }
  }

  /* The stage stands in for the transcript rather than sitting beside it:
     when something is on screen, that is what the person is looking at, and
     a message box next to it is just noise competing for the same eyes. The
     conversation is still there — it comes back the moment the stage
     clears, and nothing in it is lost meanwhile. */
  #stageFrame { display: none; width: 100%; height: 100%; border: 0; }
  .stage.framed .stage-img-wrap { display: none; }
  .stage.framed #stageFrame { display: block; }
  .stage-close { position: absolute; top: .5rem; left: .5rem; z-index: 2;
                 width: 2rem; height: 2rem; border-radius: 50%; border: none;
                 background: rgba(0,0,0,.6); color: #fff; font-size: 1.2rem;
                 line-height: 1; cursor: pointer; }
  .stage-close:hover { background: rgba(0,0,0,.85); }
  /* Stack, don't hide the column: the transcript goes, the three buttons
     stay. Hiding the whole column would take Mute/Copy/End with it, and a
     call you cannot end without first closing a video is a worse screen
     than the one this replaced. */
  body:not(.kiosk) #callScreen.stage-only .split { flex-direction: column; }
  body:not(.kiosk) #callScreen.stage-only .col-chat { flex: 0 0 auto; order: 2; }
  body:not(.kiosk) #callScreen.stage-only .convo { display: none; }
  body:not(.kiosk) #callScreen.stage-only .stage.on { order: 1; flex: 1 1 auto;
                                                      max-height: none; }

  /* ---------------- the unit card ----------------
     Our own HTML in the stage, instead of somebody else's website: same
     origin so it always renders, our design so it reads standing two metres
     away, and no keyboard needed to use it.

     Every empty slot is labelled with what is missing rather than hidden.
     The card is going in front of the sales team, and a blank that says
     "ภาพห้อง — รอจากฝ่ายขาย" asks for the spreadsheet more clearly than any
     email has. */
  #unitCard { display: none; position: absolute; inset: 0; overflow-y: auto;
              background: #0a0e17; color: #f3ede1; padding: 2.4vmin; }
  .stage.unit #unitCard { display: block; }
  .stage.unit .stage-img-wrap, .stage.unit #stageFrame,
  .stage.unit .stage-bar { display: none; }

  /* Impossible to mistake for the real thing, and it travels with the card
     rather than being said once at the start of the conversation. */
  .uSample { background: #6d4b12; color: #ffe9b8; border: 1px solid #b98c2e;
             border-radius: .6rem; padding: .55rem .9rem; font-size: .82rem;
             line-height: 1.45; margin-bottom: 1rem; }
  .uSample b { color: #fff3d4; }

  .uTop { display: flex; gap: 1rem; align-items: stretch; }
  .uShot, .uPlan { flex: 1 1 0; min-height: 26vh; border-radius: 1rem;
                   border: 1px dashed rgba(201,169,106,.42);
                   background: rgba(255,255,255,.03); display: flex;
                   align-items: center; justify-content: center; text-align: center;
                   color: #8a8069; font-size: .82rem; padding: 1rem; }
  .uPlan { flex: 0 0 34%; }
  .uShot img, .uPlan img { max-width: 100%; max-height: 100%; object-fit: contain;
                           border-radius: .8rem; }

  .uBadge { display: inline-flex; align-items: center; gap: .45rem;
            font-size: .82rem; padding: .3rem .8rem; border-radius: 99px;
            background: rgba(255,255,255,.07); margin-bottom: .8rem; }
  .uBadge i { width: .55rem; height: .55rem; border-radius: 50%;
              background: #6b7280; font-style: normal; }
  .uBadge.available i { background: #35c46a; }
  .uBadge.reserved i { background: #e0a33a; }
  .uBadge.sold i { background: #c0555a; }

  .uRoom { font-size: 2.6rem; font-weight: 700; letter-spacing: .02em;
           color: #f0e4c8; line-height: 1.1; margin-top: 1.1rem; }
  .uMeta { color: #a99f89; font-size: .95rem; margin-top: .35rem; }
  .uRule { border: none; border-top: 1px solid rgba(201,169,106,.22);
           margin: 1rem 0; }
  .uPrice { font-size: 1.15rem; color: #cfc4ab; }
  .uPrice b { font-size: 2.1rem; color: #e8c87a; font-weight: 700;
              margin: 0 .35rem; }
  .uPrice .missing { font-size: 1rem; color: #b98c2e; font-weight: 600; }
  .uWho { margin-top: .8rem; font-size: .78rem; color: #7c7364; }

  @media (min-aspect-ratio: 3/2) {
    .uRoom { font-size: 2rem; }
    .uPrice b { font-size: 1.6rem; }
    .uShot, .uPlan { min-height: 20vh; }
  }

  /* ================= operator display refresh =================
     The laptop is a working console, not the robot's face. Keep every
     existing control and event target, but give the content the width and
     hierarchy of a presentation desk instead of a narrow mobile mockup. */
  :root {
    --ink: #172033;
    --muted: #6f7682;
    --paper: #f7f4ed;
    --panel: rgba(255,255,255,.88);
    --line: rgba(23,32,51,.12);
    --navy: #101b31;
    --gold: #b5975f;
    --gold-soft: #e9ddc3;
    --shadow: 0 24px 70px rgba(28,35,49,.10);
  }

<body>

<section class="screen active" id="pickerScreen">
  <h1>Choose a voice</h1>
  <p class="sub" id="providerLine">…</p>
  <div id="setupErr"></div>
  <div class="carousel">
    <button class="arrow" id="prevBtn" aria-label="Previous voice">&#8249;</button>
    <div class="orb" id="pickOrb"></div>
    <button class="arrow" id="nextBtn" aria-label="Next voice">&#8250;</button>
  </div>
  <div class="voice-name" id="voiceName">…</div>
  <p class="voice-desc" id="voiceDesc"></p>
  <div class="dots" id="dots"></div>
  <button class="btn wide" id="startBtn" disabled>Start conversation</button>
  <p class="note" id="pickerNote"></p>
</section>

<section class="screen" id="callScreen">
  <!-- Kiosk chrome. Present in the DOM always, shown only under body.kiosk,
       so the laptop page it grew out of keeps exactly the markup it had. -->
  <div class="kHead">
    <div class="kBrand">EMBASSY<small>CONDOMINIUM · PATTAYA</small></div>
    <div class="kStatus"><i id="kDot"></i><span id="kOnline">ออนไลน์</span>
      <b id="kClock">--:--</b></div>
  </div>

  <div class="kHero">
    <div class="kOrbWrap"><div class="orb" id="kOrb"></div></div>
    <div class="kName">EMMA<small id="kRole">Embassy AI Concierge</small></div>
    <!-- What Emma just *did*, taken from the tool result rather than from
         what the microphone thought it heard. A public screen quoting a
         mishearing makes a working robot look broken; a public screen
         naming a completed action cannot. -->
    <div class="kChip" id="kChip"></div>
    <div class="kSay" id="kSay"></div>
  </div>

  <div class="callbar">
    <div class="orb" id="callOrb"></div>
    <div class="meta">
      <div class="state" id="stateLabel">connecting</div>
      <div class="level"><div id="levelBar"></div></div>
      <p class="note" id="callNote" style="text-align:left"></p>
    </div>
  </div>

  <div class="split">
    <div class="col-chat">
      <div class="convo" id="convo" aria-live="polite"></div>
      <div class="controls">
        <button class="btn ghost" id="muteBtn">Mute</button>
        <button class="btn ghost icon" id="copyBtn" title="Copy transcript">Copy</button>
        <!-- Translator switch. Invisible on the robot's chest screen by
             construction (body.kiosk hides .col-chat): a passer-by must not
             be able to flip the machine into interpreter mode. -->
        <select class="btn ghost icon" id="langSel" title="ล่ามแปลเป็นภาษา" hidden></select>
        <button class="btn ghost icon" id="translatorBtn" title="โหมดล่าม ไทย ↔ ภาษาอื่น">ล่าม</button>
        <button class="btn" id="endBtn">End</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="stage-img-wrap"><img id="stageImg" alt="" /></div>
      <!-- Framed content lives in its own layer rather than replacing the
           image: a slide and a video are different things and swapping the
           element each time loses whichever one was already loaded. -->
      <iframe id="stageFrame" allow="autoplay; encrypted-media; picture-in-picture"
              referrerpolicy="strict-origin-when-cross-origin"
              sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
      <button class="stage-close" id="stageClose" title="ปิดจอ">&times;</button>
      <div id="unitCard"></div>
      <div class="stage-bar">
        <span id="stageTitle"></span>
        <span id="stagePos"></span>
      </div>
      <a class="stage-open" id="openDisplay" href="/display" target="_blank"
         title="Open the fullscreen display">เปิดจอเต็ม ↗</a>
    </div>
  </div>

  <div class="kFoot">
    <button class="kBtn" id="kHome" title="กลับหน้าหลัก">&#8962;</button>
    <button class="kMic" id="kMic"><span></span></button>
    <div class="kHint" id="kHint">แตะเพื่อพูด</div>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);

let voices = [], idx = 0, selectedVoice = null, providerName = 'gemini';

let ws = null, audioCtx = null, micStream = null, micSource = null, worklet = null;
let muted = false, playHead = 0, sources = [], playing = false;
let inputRate = 16000, outputRate = 24000;
let sentMs = 0, halfDuplex = false;

// ---------------- voice picker ----------------

function renderVoice() {
  const v = voices[idx];
  if (!v) return;
  const orb = $('pickOrb');
  orb.style.setProperty('--c1', v.gradient[0]);
  orb.style.setProperty('--c2', v.gradient[1]);
  orb.style.transform = 'scale(.94)';
  setTimeout(() => { orb.style.transform = 'scale(1)'; }, 20);
  $('voiceName').innerHTML = v.name + (v.recommended ? '<span class="badge">BEST</span>' : '');
  $('voiceDesc').textContent = v.description_en + ' · ' + v.description_th;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === idx));
  selectedVoice = v.id;
}

const move = (d) => { idx = (idx + d + voices.length) % voices.length; renderVoice(); };
$('prevBtn').onclick = () => move(-1);
$('nextBtn').onclick = () => move(1);
document.addEventListener('keydown', (e) => {
  if (!$('pickerScreen').classList.contains('active')) return;
  if (e.key === 'ArrowLeft') move(-1);
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'Enter' && !$('startBtn').disabled) startCall();
});

// The voice carousel is no longer a step anyone walks through — a kiosk
// picks its voice from .env (or ?voice=) and never asks. The screen is kept
// behind ?picker=1 rather than deleted, because "let me hear the other
// voices" is a real thing to want once, on a laptop, before deciding.
const wantsPicker = new URLSearchParams(location.search).get('picker') === '1';

// ---------------- kiosk skin ----------------
// ?kiosk=1 dresses this same page as the robot's screen. Explicit rather
// than guessed from the window shape: a laptop window dragged tall is not a
// robot, and a page that redecorates itself while someone is working in it
// is worse than one that needs a flag. Inside kiosk mode the *layout* then
// does follow the shape (see the aspect-ratio block in the stylesheet),
// because that part really is about the panel.
const kioskMode = new URLSearchParams(location.search).get('kiosk') === '1';
if (kioskMode) {
  document.body.classList.add('kiosk');
  setInterval(kioskClock, 10000);
  kioskClock();
  armIdleCursor();
}

//: Kiosk screens should not show a pointer, but "should not show" is not
//: "must never exist": on the machine this is built on, hiding it outright
//: means the mic button cannot be aimed at. Hide it when the mouse stops,
//: bring it back the moment it moves. A touch panel simply never moves one.
function armIdleCursor() {
  let t = null;
  const hide = () => document.body.classList.add('idlecursor');
  const wake = () => {
    document.body.classList.remove('idlecursor');
    if (t) clearTimeout(t);
    t = setTimeout(hide, 2500);
  };
  document.addEventListener('mousemove', wake);
  document.addEventListener('pointerdown', wake);
  wake();
}

function kioskClock() {
  const d = new Date();
  $('kClock').textContent =
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

//: The action chip: what Emma just *did*. Cleared when the line sleeps so a
//: finished visit does not leave its last instruction on a public screen.
function kioskAction(text) {
  if (!kioskMode) return;
  $('kChip').textContent = text || '';
  $('kChip').classList.toggle('on', Boolean(text));
}

function kioskSay(text) {
  if (!kioskMode) return;
  $('kSay').textContent = text || '';
}

Promise.all([
  fetch('/voices').then((r) => r.json()),
  fetch('/health').then((r) => r.json()),
]).then(([vd, health]) => {
  voices = vd.voices;
  providerName = health.provider;
  idx = Math.max(0, voices.findIndex((v) => v.id === vd.default));
  $('dots').innerHTML = voices.map((_, i) => `<button class="dot" data-i="${i}"></button>`).join('');
  [...$('dots').children].forEach((d) => { d.onclick = () => { idx = +d.dataset.i; renderVoice(); }; });
  renderVoice();

  $('providerLine').innerHTML = health.model
    + (health.free_tier ? ' <span class="pill">FREE TIER</span>' : '');

  if (!health.api_key_configured) {
    const key = health.provider === 'gemini' ? 'GEMINI_API_KEY' : 'OPENAI_API_KEY';
    const where = health.provider === 'gemini'
      ? 'Get a free key at <a href="https://aistudio.google.com/apikey">aistudio.google.com/apikey</a>.'
      : 'Create one in your OpenAI dashboard.';
    $('setupErr').innerHTML = `<div class="err">No <code>${key}</code> on the server. ${where}
      Put it in <code>.env</code> and restart uvicorn.</div>`;
    return;
  }
  $('startBtn').disabled = false;
  $('pickerNote').textContent = 'Speech-to-speech — you can interrupt at any time.';
  autoConnect = !!health.auto_connect;
  if (typeof health.transcript_keep_min === 'number') {
    transcriptKeepMin = health.transcript_keep_min;
  }
  if (health.mic) {
    micBoost = health.mic.boost || 1;
    // The call's own boost: standby keeps far-field reach (you call her
    // name from anywhere), the call listens to the person at the desk.
    micCallBoost = (typeof health.mic.boost_call === 'number') ? health.mic.boost_call : micBoost;
    micNS = !!health.mic.noise_suppression;
    // Default true when the server predates the switches.
    micCompressor = health.mic.compressor !== false;
    micAGC = health.mic.agc !== false;
  }
  wakeAvailable = !!(health.wake && health.wake.ready);
  if (wantsPicker) return;    // ?picker=1 — stay on the voice carousel
  if (autoConnect) {
    startCall();              // no button, no name — straight in
  } else {
    // Everything else lands on the one screen, asleep. With a wake word it
    // waits for the name; without one the same button that says End during
    // a call says "เริ่มคุย" here, which is what the gallery's defaults
    // (AUTO_CONNECT and WAKE_ENABLED both off) rely on to be usable at all.
    goToSleep();
    if (!wakeAvailable) sleepNote('กดปุ่ม "เริ่มคุย" ด้านล่างเพื่อเริ่มสนทนา');
  }
}).catch(() => {
  $('setupErr').innerHTML = '<div class="err">Could not reach the server. Is uvicorn running?</div>';
});

// ---------------- conversation panel ----------------
// Bubbles stream in as text arrives rather than appearing only when a turn
// ends, so the panel tracks the conversation live. `liveTurn` holds the
// bubble currently being appended to, per role.

const liveTurn = { user: null, bot: null };
const LABEL = { user: 'คุณ · You', bot: 'ผู้ช่วย · Assistant' };
const TOOL_LABELS = {
  set_lights: 'ไฟ · lights',
  set_air_conditioner: 'แอร์ · air conditioner',
  get_room_status: 'สถานะห้อง · room status',
  show_slide: 'สไลด์ · slide',
  start_presentation: 'เริ่มพรีเซนต์ · presentation',
  next_slide: 'สไลด์ถัดไป · next slide',
  previous_slide: 'สไลด์ก่อนหน้า · previous slide',
  hide_slide: 'ปิดภาพ · hide slide',
  search_condo_info: 'ค้นข้อมูล · lookup',
};

// Mirror of the robot's screen, inside the conversation window. Without it,
// running a presentation with no /display window open looked like nothing
// had happened — the tools reported success and the screen stayed empty.
let warnedNoDisplay = false;

// The picture waits for the ear.
//
// The model produces a whole narration turn several times faster than it
// takes to say it, and playChunk() queues that audio back-to-back — playHead
// legitimately sits five to ten seconds ahead of currentTime. So when the
// model calls next_slide, it has finished *generating* the sentences about
// the slide it is leaving, but the guest is still near the start of hearing
// them. Changing the picture at that moment puts every screen a paragraph
// ahead of the conversation.
//
// This browser is the only thing that knows when the guest actually gets
// there, so it decides — and tells the server, which drives the Canva window
// and the fullscreen display from the same moment.
let pendingSlide = null, pendingSlideTimer = null;

function applyPendingSlide() {
  if (pendingSlideTimer) { clearTimeout(pendingSlideTimer); pendingSlideTimer = null; }
  const p = pendingSlide;
  pendingSlide = null;
  if (!p) return;
  showStage(p.slide, p.displays);
}

function audioLeadMs() {
  return audioCtx ? Math.max(0, (playHead - audioCtx.currentTime) * 1000) : 0;
}

// The fullscreen display and the Canva window are driven by the server, which
// has no idea how much audio is sitting in this browser's queue. Tell it.
let lastReportedLead = -1;
function reportAudioLead() {
  const ms = Math.round(audioLeadMs());
  if (Math.abs(ms - lastReportedLead) < 250) return;
  lastReportedLead = ms;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'audio_lead', ms }));
  }
}

function scheduleSlide(slide, displays) {
  if (pendingSlideTimer) { clearTimeout(pendingSlideTimer); pendingSlideTimer = null; }
  pendingSlide = { slide, displays };
  const queuedMs = audioLeadMs();
  // Below a fifth of a second nobody perceives the difference, and waiting
  // costs a timer for nothing.
  if (queuedMs < 200) applyPendingSlide();
  else pendingSlideTimer = setTimeout(applyPendingSlide, queuedMs);
}

//: Render the unit card — our own HTML, built from data the server looked
//: up. The model never sends values here; it sends a room number and the
//: server answers from the sales team's own table (or, until that arrives,
//: from a sample that says so on its face).
function showUnit(u) {
  const baht = (n) => Number(n).toLocaleString('th-TH');
  const el = (t) => { const d = document.createElement('div'); d.textContent = t; return d; };
  const card = $('unitCard');
  card.textContent = '';
  card.className = 'unit-detail';

  if (u.sample) {
    const warn = document.createElement('div');
    warn.className = 'uSample';
    warn.innerHTML = '<b>ตัวอย่างเท่านั้น — ยังไม่ใช่ข้อมูลจริง</b><br>' +
      'ตัวเลขทุกตัวบนการ์ดนี้สมมติขึ้นเพื่อให้เห็นหน้าตาระบบ ' +
      'รอตารางยูนิตจากฝ่ายขาย (พร้อมผู้อนุมัติราคาและวันที่ใช้ได้ถึง)';
    card.appendChild(warn);
  }

  const top = document.createElement('div');
  top.className = 'uTop';
  const shot = document.createElement('div');
  shot.className = 'uShot';
  // A labelled blank, not a hidden one. This card is going in front of the
  // sales team, and an empty slot that names what belongs in it asks for
  // the spreadsheet more clearly than an email has managed to.
  if (u.photo) { const i = new Image(); i.src = u.photo; shot.appendChild(i); }
  else shot.appendChild(el('ภาพห้อง — รอจากฝ่ายขาย'));
  const plan = document.createElement('div');
  plan.className = 'uPlan';
  if (u.floorplan) { const i = new Image(); i.src = u.floorplan; plan.appendChild(i); }
  else plan.appendChild(el('แปลนรายยูนิต — รอจากฝ่ายขาย'));
  top.append(shot, plan);
  card.appendChild(top);

  if (u.status_th) {
    const b = document.createElement('div');
    b.className = 'uBadge ' + (u.status || '');
    b.innerHTML = '<i></i>';
    b.appendChild(el(u.status_th));
    b.style.marginTop = '1rem';
    card.appendChild(b);
  }

  const room = el('ห้อง ' + (u.room || '—'));
  room.className = 'uRoom';
  const bits = [];
  if (u.floor) bits.push('ชั้น ' + u.floor);
  if (u.type) bits.push(u.type);
  if (u.sqm) bits.push(u.sqm + ' ตร.ม.');
  if (u.aspect) bits.push(u.aspect);
  const meta = el(bits.join('  ·  '));
  meta.className = 'uMeta';
  card.append(room, meta);

  const rule = document.createElement('hr');
  rule.className = 'uRule';
  card.appendChild(rule);

  const price = document.createElement('div');
  price.className = 'uPrice';
  if (u.price_thb) {
    // The pricelist's own structure: base_price is the list price,
    // promo_price the selling price. Showing the gap is the sales pitch
    // the spreadsheet already makes.
    if (u.base_price_thb && u.base_price_thb > u.price_thb) {
      const was = el('ราคาตั้ง ' + baht(u.base_price_thb) + ' บาท');
      was.style.textDecoration = 'line-through';
      was.style.opacity = '.55';
      was.style.fontSize = '.85rem';
      price.appendChild(was);
    }
    price.append(el('เริ่มต้น'), (() => {
      const b = document.createElement('b'); b.textContent = baht(u.price_thb); return b;
    })(), el('บาท'));
    [...price.children].forEach((c) => (c.style.display = 'inline'));
  } else if (u.source === 'live' && !document.body.classList.contains('kiosk')) {
    // Tap-to-reveal, one nationality at a time. The DB carries two prices
    // (promo_price = Price CN/TN คนไทย, base_price = Price FN ต่างชาติ —
    // pricelist columns R/S), and the wrong-nationality figure must not
    // float up in front of whoever is standing there — pressing IS the
    // decision. Fetched from /unit_price on the tap, so the numbers still
    // never pass through the model or its tool results. Not on the kiosk:
    // the robot's chest is public, and a passer-by's tap is not a decision.
    const revealPrice = (label, key) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = 'btn ghost';
      b.style.cssText = 'font-size:.85rem;padding:.4rem .8rem;margin-right:.5rem';
      b.onclick = async () => {
        try {
          const tok = new URLSearchParams(location.search).get('token');
          const res = await fetch('/unit_price?room=' + encodeURIComponent(u.room)
            + (tok ? '&token=' + encodeURIComponent(tok) : ''));
          if (!res.ok) throw new Error();
          const d = await res.json();
          const shown = el(label + ': ' + (d[key] != null ? baht(d[key]) + ' บาท' : '—'));
          shown.style.cssText = 'display:inline;font-weight:700;margin-right:.8rem';
          b.replaceWith(shown);
        } catch {
          b.textContent = label + ' — เช็คไม่ได้';

  } else {
    // Two different absences. A sample table missing its column is a gap
    // waiting for the spreadsheet; a live card without a price is the
    // showroom's own policy — the number exists, and the sales desk is
    // where it gets said.
    const m = el(u.sample ? 'ราคา — รอจากฝ่ายขาย' : 'ราคา — สอบถามฝ่ายขาย');

  const who = el(u.source === 'live'
    ? ('ข้อมูลสดจากระบบผังขาย · อัปเดต ' + (u.updated_at || '—'))

    ? 'ผู้อนุมัติราคา: — · ใช้ได้ถึง: —   (ช่องที่ต้องกรอกในตารางจริง)'
    : ('ผู้อนุมัติราคา: ' + (u.approved_by || '—') +

//: The live floor plan: the sales system's own composite image with an SVG
//: overlay colored by status. Coordinates are percent-of-image (the DB
//: stores them that way), so one viewBox 0-100 with
//: preserveAspectRatio="none" maps every unit without knowing the image's
//: pixel size. Rotated rooms carry a `poly`; everything else is a rect.
//: No prices anywhere on it — policy — and available stays transparent so
//: the plan's own artwork shows through, same as the sales app.
function showPlan(r) {
  const card = $('unitCard');
  card.textContent = '';
  card.className = '';

  const head = document.createElement('div');
  head.className = 'uMeta';
  head.style.display = 'flex';
  head.style.justifyContent = 'space-between';
  head.style.marginBottom = '.5rem';
  const title = document.createElement('b');
  title.style.color = '#f0e4c8';
  title.textContent = 'ผังชั้น ' + r.floor + (r.building ? ' · ตึก ' + r.building : '');
  const legend = document.createElement('span');
  const c = r.counts || {};
  legend.textContent = 'ว่าง ' + (c.available || 0) + ' · จอง ' + (c.reserved || 0)
    + ' · ขายแล้ว ' + (c.sold || 0);
  head.append(title, legend);
  card.appendChild(head);

  const wrap = document.createElement('div');
  wrap.style.position = 'relative';
  const img = new Image();
  img.src = r.image;
  img.style.width = '100%';
  img.style.display = 'block';
  img.style.borderRadius = '.6rem';
  wrap.appendChild(img);

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  const FILL = { sold: 'rgba(192,85,90,.72)', reserved: 'rgba(224,163,58,.72)',
                 available: 'rgba(53,196,106,.16)' };
  for (const u of (r.units || [])) {
    let shape;
    if (u.poly && u.poly.length >= 3) {
      shape = document.createElementNS(NS, 'polygon');
      shape.setAttribute('points', u.poly.map((p) => p[0] + ',' + p[1]).join(' '));
    } else {
      shape = document.createElementNS(NS, 'rect');
      shape.setAttribute('x', u.x); shape.setAttribute('y', u.y);
      shape.setAttribute('width', u.w); shape.setAttribute('height', u.h);
    }
    shape.setAttribute('fill', FILL[u.status] || 'transparent');
    shape.setAttribute('stroke', 'rgba(255,255,255,.35)');
    shape.setAttribute('stroke-width', '.08');

    svg.appendChild(shape);

  wrap.appendChild(svg);
  card.appendChild(wrap);

  const foot = document.createElement('div');
  foot.className = 'uWho';
  foot.textContent = 'สถานะสดจากระบบผังขาย ณ ตอนนี้ · แดง=ขายแล้ว เหลือง=จอง โปร่ง=ว่าง';
  card.appendChild(foot);

  const stage = $('stage');
  if (stage.classList.contains('framed')) {
    $('stageFrame').removeAttribute('src');
    stage.classList.remove('framed');
  }
  stage.classList.add('on', 'unit');
  $('callScreen').classList.add('with-slides', 'stage-only');
}

//: The available-units list — find_units' answer, on the same card

  card.appendChild(note);

    cell.append(rm, sz, meta);
