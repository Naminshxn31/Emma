<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emma แชทบอท (ทดสอบคลังความรู้)</title>
<style>
  :root{ --bg:#0b0e12; --panel:#12161c; --line:#232a33; --ink:#e7edf3; --muted:#8b97a5;
    --emma:#182028; --me:#1f6f43; --me2:#33d17a; --chip:#1b2027; --warn:#6b5a1e; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;
    align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}
  header .note{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:900px;width:100%;margin:0 auto}
  .msg{max-width:80%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
  .msg.emma{align-self:flex-start;background:var(--emma);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;max-width:100%;text-align:center}
  .src{align-self:flex-start;max-width:80%;margin-top:-6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .src .lbl{font-size:11px;color:var(--muted)}
  .chip{font-size:11px;color:var(--muted);background:var(--chip);border:1px solid var(--line);
    border-radius:999px;padding:2px 8px;cursor:default}
  .chip.warn{color:#f0dca0;border-color:var(--warn)}
  .chip.none{color:#f0b3bd;border-color:#7a2230}
  details.seen{align-self:flex-start;max-width:80%;font-size:12px;color:var(--muted)}
  details.seen pre{white-space:pre-wrap;background:#05070a;border:1px solid var(--line);
    border-radius:8px;padding:8px;max-height:220px;overflow:auto;margin:6px 0 0}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);max-width:900px;width:100%;margin:0 auto}
  #q{flex:1;background:#0c1015;border:1px solid var(--line);border-radius:10px;color:var(--ink);
    padding:10px 12px;font:inherit}
  #send{background:var(--me);border:1px solid var(--me2);color:#fff;border-radius:10px;padding:0 18px;
    font-weight:600;cursor:pointer}
  #send:disabled{opacity:.5;cursor:default}
  .starter{align-self:center;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:100%}
  .starter button{font-size:12px;color:var(--muted);background:var(--chip);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Emma แชทบอท</h1>
  <span class="note" id="mdl">ทดสอบคลังความรู้ · โมเดล local (ไม่เผา quota)</span>
</header>

<div id="log">
  <div class="msg sys">พิมพ์ถาม Emma ได้เลย · ใต้คำตอบจะบอกว่าหยิบจากไฟล์ไหน (ถ้าไม่มีไฟล์ = อาจแต่งเอง)</div>
  <div class="starter" id="starter">
    <button>โครงการนี้มีสิ่งอำนวยความสะดวกอะไรบ้าง</button>
    <button>ที่นี่อยู่ที่ไหน เดินทางยังไง</button>
    <button>Empire Group คือใคร</button>
    <button>ราคาเริ่มต้นเท่าไหร่</button>
    <button>Embassy Life กับที่นี่ต่างกันยังไง</button>
  </div>
</div>

<form id="f">
  <input id="q" autocomplete="off" placeholder="พิมพ์คำถามถึง Emma…" autofocus>
  <button id="send" type="submit">ส่ง</button>
</form>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $('log'), q = $('q'), send = $('send'), form = $('f');
const history = [];   // [{role:'user'|'assistant', text}]

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function sources(list, retrieved, commercial) {
  const wrap = document.createElement('div'); wrap.className = 'src';
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = 'จาก:';
  wrap.appendChild(lbl);
  if (commercial) {
    const c = document.createElement('span'); c.className = 'chip warn';
    c.textContent = 'คำถามราคา — กันไว้'; wrap.appendChild(c);
  }
  if (!list.length) {
    const c = document.createElement('span'); c.className = 'chip none';
    c.textContent = 'ไม่มีไฟล์อ้างอิง'; wrap.appendChild(c);
  } else {
    for (const s of list) {
      const c = document.createElement('span'); c.className = 'chip';
      c.textContent = s.replace('corpus/', '').replace('embassy-world/', 'EW/');
      wrap.appendChild(c);
    }
  }
  log.appendChild(wrap);
  if (retrieved && retrieved.length) {
    const det = document.createElement('details'); det.className = 'seen';
    const sum = document.createElement('summary'); sum.textContent = 'ดูข้อความที่ค้นเจอ (' + retrieved.length + ')';
    det.appendChild(sum);
    const pre = document.createElement('pre');
    pre.textContent = retrieved.map(r => '【' + r.file + '】\n' + r.text).join('\n\n');
    det.appendChild(pre); log.appendChild(det);
  }
  log.scrollTop = log.scrollHeight;
}

async function ask(text) {
  const starter = $('starter'); if (starter) starter.remove();
  bubble('me', text);
  history.push({ role: 'user', text });
  send.disabled = true; q.disabled = true;
  const thinking = bubble('emma', '…');
  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });
    const d = await res.json();
    if (!d.ok) { thinking.textContent = '⚠️ ' + (d.error || 'ตอบไม่ได้'); }
    else {
      thinking.textContent = d.reply || '(ไม่มีคำตอบ)';
      history.push({ role: 'assistant', text: d.reply || '' });
      sources(d.sources || [], d.retrieved || [], d.commercial);
      if (d.model) $('mdl').textContent = 'ทดสอบคลังความรู้ · โมเดล ' + d.model + ' (local ไม่เผา quota)';
    }
  } catch (e) {
    thinking.textContent = '⚠️ เชื่อมต่อไม่ได้: ' + e.message;
  }
  send.disabled = false; q.disabled = false; q.focus();
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; ask(text);
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('#starter button');
  if (b) ask(b.textContent);
});

// Show Emma's opening line, generated the same way production sends it on
// connect, so the greeting itself can be read and tuned here.
(async () => {
  try {
    const res = await fetch('/greeting');
    const d = await res.json();
    if (d.ok && d.reply) {
      const starter = $('starter');
      const el = document.createElement('div');
      el.className = 'msg emma'; el.textContent = d.reply;
      if (starter) log.insertBefore(el, starter); else log.appendChild(el);
    }
  } catch (e) { /* greeting is optional; the page still works without it */ }
})();
</script>
</body>
</html>
