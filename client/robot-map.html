<title>แผนที่หุ่น</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0d10; --panel:#14181d; --line:#262c33; --ink:#e8edf2;
    --muted:#8a949e; --go:#3a844a; --stop2:#a12d40; --lock:#6b5a1e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; min-height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header b { font-size:17px; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill.on { color:#cfe9d4; border-color:var(--go); background:rgba(47,107,58,.18); }
  .pill.warn { color:#f0dca0; border-color:var(--lock); background:rgba(107,90,30,.18); }
  .pill.bad { color:#f0b3bd; border-color:var(--stop2); background:rgba(122,34,48,.18); }
  main { flex:1; display:flex; flex-direction:column; align-items:center;
    gap:12px; padding:16px; }
  .wrap { position:relative; max-width:100%; overflow:auto;
    border:1px solid var(--line); border-radius:12px; background:#000; }
  canvas { display:block; image-rendering:pixelated; touch-action:none;
    cursor:crosshair; }
  .note { color:var(--muted); font-size:13px; text-align:center; max-width:440px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    justify-content:center; }
  button { border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.stop { background:var(--stop2); border-color:var(--stop2); font-weight:700; }
  button[disabled] { opacity:.4; cursor:not-allowed; }
  .foot { color:var(--muted); font-size:12px; text-align:center; padding:10px;
    border-top:1px solid var(--line); }
  code { color:#7fb0ff; }
</style>

<header>
  <b>แผนที่หุ่น</b>
  <span class="pill" id="conn">— เชื่อมต่อ</span>
  <span class="pill" id="lock">— การขยับ</span>
  <span class="pill" id="sel">คลิกบนแผนที่เพื่อเลือกจุด</span>
</header>

<main>
  <div class="note" id="hint">แผนที่จากฐานนำทาง (SLAM) จุดสีเขียวคือหุ่น คลิกจุดหมายเพื่อสั่งไป</div>
  <div class="wrap"><canvas id="map" width="200" height="200"></canvas></div>
  <div class="row">
    <button id="go" disabled>ยังไม่ได้เลือกจุด</button>
    <button id="stop" class="stop">หยุด</button>
    <button id="reload">โหลดแผนที่ใหม่</button>
  </div>
  <div class="note" id="msg"></div>
</main>

<div class="foot">คลิกได้พิกัดจากแผนที่โดยตรง ไม่ต้องมี POI · ปุ่มหยุดทำงานเสมอ</div>

<script>
"use strict";
// The map viewer + click-to-go. The map itself comes from the chassis, whole,
// through the server the joystick page uses. Two things it must get exactly
// right, both from the contract agreed with the chassis owner:
//
//   * The occupancy grid is row-major starting at the map origin, so row 0 is
//     the LOWEST world-y. A canvas' y grows downward, so the grid is drawn
//     bottom-up (canvasRow = height-1-gridRow) — get this backwards and every
//     "go here" lands mirrored.
//   * A cell centre is at origin + (index + 0.5) * resolution, in metres. The
//     click is turned back into metres the same way and sent as {x, y}; the
//     distance and the driving both stay on the server (motion lock included).
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token') || '';
const q = token ? '?token=' + encodeURIComponent(token) : '';
const canvas = $('map');
const ctx = canvas.getContext('2d');

let map = null;            // {origin_x, origin_y, width, height, resolution, cells}
let motionEnabled = false;
let target = null;         // {x, y} in metres, chosen by a click
let lastPose = null;

function msg(text, bad) { const el = $('msg'); el.textContent = text || '';
  el.style.color = bad ? '#f0b3bd' : ''; }

// --- map ---
async function loadMap() {
  $('reload').disabled = true;
  try {
    const out = await (await fetch('/robot/map' + q)).json();
    if (!out.ok) throw new Error(out.error || 'map error');
    const m = out.map;
    const bin = atob(m.cells_b64);
    const cells = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) cells[i] = bin.charCodeAt(i);
    map = { origin_x: m.origin_x, origin_y: m.origin_y, width: m.width,
            height: m.height, resolution: m.resolution, cells };
    drawMap();
    msg('โหลดแผนที่แล้ว ' + m.width + '×' + m.height +
        ' (ช่องละ ' + m.resolution.toFixed(3) + ' ม.)');
  } catch (e) {
    map = null;
    $('conn').className = 'pill bad';
    $('conn').textContent = 'โหลดแผนที่ไม่ได้';
    msg('โหลดแผนที่จากฐานไม่ได้: ' + e.message +
        ' — เช็คว่าอุโมงค์และหุ่นออนไลน์', true);
  }
  $('reload').disabled = false;
}

function drawMap() {
  if (!map) return;
  canvas.width = map.width;
  canvas.height = map.height;
  const img = ctx.createImageData(map.width, map.height);
  for (let row = 0; row < map.height; row++) {
    // grid row 0 is lowest world-y; canvas row 0 is the top → flip.
    const canvasRow = map.height - 1 - row;
    for (let col = 0; col < map.width; col++) {
      // Byte semantics measured on the base 2026-09-12 (condo-voice-79,
      // scripts/probe_map_semantics.py): read as signed int8 — 0 = never
      // seen, 1..127 = free (127 the most confident), 128..255 = occupied.
      // A plain grayscale drew it inverted: floor came out mid-grey and
      // walls near-white, the worst possible reading for click-to-go.
      const v = map.cells[row * map.width + col];
      const o = (canvasRow * map.width + col) * 4;
      let r, g, b;
      if (v === 0) {                     // unknown — never explored
        r = g = b = 45;
      } else if (v <= 127) {             // free — lighter = more confident
        r = g = b = 128 + Math.round((v / 127) * 127);
      } else {                           // occupied — a wall, do not drive here
        r = 200; g = 60; b = 60;
      }
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b;
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  drawOverlay();
}

function worldToCanvas(x, y) {
  const col = (x - map.origin_x) / map.resolution - 0.5;
  const row = (y - map.origin_y) / map.resolution - 0.5;
  return { cx: col, cy: map.height - 1 - row };
}
function canvasToWorld(cx, cy) {
  const col = cx;
  const row = map.height - 1 - cy;
  return { x: map.origin_x + (col + 0.5) * map.resolution,
           y: map.origin_y + (row + 0.5) * map.resolution };
}

// The robot marker and the chosen target ride on top of the bitmap; redrawing
// the whole ImageData every second would flicker, so they are their own pass.
function drawOverlay() {
  if (!map) return;
  drawMap._base = drawMap._base;    // (bitmap already in the canvas)
  if (lastPose) {
    const p = worldToCanvas(lastPose.x, lastPose.y);
    ctx.fillStyle = '#3a844a';
    ctx.beginPath(); ctx.arc(p.cx, p.cy, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a844a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(p.cx, p.cy);
    ctx.lineTo(p.cx + Math.cos(-lastPose.yaw) * 8,
               p.cy + Math.sin(-lastPose.yaw) * 8); ctx.stroke();
  }
  if (target) {
    const t = worldToCanvas(target.x, target.y);
    ctx.strokeStyle = '#f0b3bd'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(t.cx, t.cy, 4, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(t.cx - 6, t.cy); ctx.lineTo(t.cx + 6, t.cy);
    ctx.moveTo(t.cx, t.cy - 6); ctx.lineTo(t.cx, t.cy + 6); ctx.stroke();
  }
}

canvas.addEventListener('click', (e) => {
  if (!map) return;
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (canvas.width / r.width);
  const cy = (e.clientY - r.top) * (canvas.height / r.height);
  target = canvasToWorld(cx, cy);
  $('sel').textContent = 'จุดหมาย x ' + target.x.toFixed(2) + '  y ' + target.y.toFixed(2);
  $('go').disabled = !(motionEnabled);
  $('go').textContent = motionEnabled
    ? 'สั่งไปจุดนี้' : 'ไปไม่ได้ — การขยับล็อก';
  drawMap();          // repaint bitmap + overlay with the new target
});

// --- commands (same endpoint + lock as the joystick) ---
async function command(body) {
  const res = await fetch('/robot/command', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token }, body)),
  });
  return res.json();
}

$('go').addEventListener('click', async () => {
  if (!target || !motionEnabled) return;
  $('go').disabled = true;
  try {
    const r = await command({ action: 'goto', x: target.x, y: target.y });
    msg(r.ok ? 'ส่งคำสั่งไปจุดหมายแล้ว — ติดตามจุดเขียว หยุดได้ทุกเมื่อ'
             : 'สั่งไม่ได้: ' + (r.error || 'ไม่ทราบสาเหตุ'),
        !r.ok);
  } catch (e) {
    msg('ส่งคำสั่งไม่ได้: ' + e.message, true);
  }
  $('go').disabled = false;
});

$('stop').addEventListener('click', async () => {
  try { const r = await command({ action: 'stop' });
    msg(r.ok ? 'สั่งหยุดแล้ว' : 'สั่งหยุดไม่ได้: ' + (r.error || ''), !r.ok);
  } catch (e) { msg('สั่งหยุดไม่ได้: ' + e.message, true); }
});

$('reload').addEventListener('click', loadMap);

// --- live state: robot marker + lock indicator ---
async function poll() {
  let s = null;
  try {
    const out = await (await fetch('/robot/state' + q)).json();
    s = out && out.ok ? out.state : null;
    if (!s) throw new Error((out && out.error) || 'state');
  } catch (e) {
    $('conn').className = 'pill bad'; $('conn').textContent = 'ต่อฐานไม่ได้';
    return;
  }
  $('conn').className = 'pill ' + (s.connected ? 'on' : 'bad');
  $('conn').textContent = s.connected ? 'เชื่อมต่อ' : 'ฐานไม่ตอบ';
  motionEnabled = !!s.motion_enabled;
  $('lock').className = 'pill ' + (motionEnabled ? 'warn' : '');
  $('lock').textContent = motionEnabled ? 'การขยับ: ปลดล็อก' : 'การขยับ: ล็อก';
  if (target) $('go').disabled = !motionEnabled;
  lastPose = s.pose || null;
  if (map) drawMap();
}

loadMap();
poll();
setInterval(poll, 1500);
</script>
