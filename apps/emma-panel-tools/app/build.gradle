plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emma.panel.tools'
    compileSdk 34

    defaultConfig {
        applicationId 'com.emma.panel.tools'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
