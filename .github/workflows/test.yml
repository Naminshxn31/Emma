name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install uv==0.12.1
      - name: Check lock and clean install
        run: uv sync --locked --all-extras
      - name: Verify installed dependencies
        run: uv pip check
      - name: Import smoke (no devices or model downloads)
        run: uv run --locked --all-extras python scripts/smoke_install.py --all-extras
      - name: Source contract (clean checkout, no private assets)
        run: uv run --locked --all-extras python scripts/audit_data_sources.py --mode ci
      - name: Tests with fake providers
        run: uv run --locked --all-extras python -m pytest -q
      - name: Browser JavaScript
        run: node tests/client_metrics.cjs
      - name: First greeting audio regression
        run: node tests/client_audio_start.cjs
      - name: Voice session lifecycle regression
        run: node tests/client_voice_lifecycle.cjs
