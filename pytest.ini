[pytest]
testpaths = tests
# Fake upstream servers run their own event loops in background threads;
# tearing them down emits harmless "Event loop is closed" noise that would
# otherwise bury the real results.
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning
# A wedged WebSocket test should fail fast, not hang the suite.
timeout = 20
markers =
    allow_browser_launch: drives _launch_browser on purpose, with a fake playwright underneath. Everything else is blocked from opening a real window — see tests/conftest.py
